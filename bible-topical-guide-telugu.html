<style>
:root{
  --bg:#f7f4ee; --panel:#ffffff; --ink:#2b2118; --muted:#7a6a58;
  --accent:#9c4a1a; --accent-dark:#7a3413; --accent-soft:#f0e2d4;
  --gold:#c99a3c; --line:#e7dfd2; --danger:#a33; --sidebar-w:300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans Telugu','Nirmala UI','Gautami',sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
.app{display:flex;flex-direction:column;height:100%}
/* ---------- header ---------- */
header.topbar{background:linear-gradient(135deg,#7a3413,#a05520 60%,#8a4318);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(60,30,10,.25);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;color:#9c4a1a;font-weight:700;flex:none;box-shadow:inset 0 0 0 2px #c99a3c}
.brand h1{font-size:1.05rem;font-weight:700;line-height:1.3;white-space:nowrap}
.brand .sub{font-size:.65rem;opacity:.85;font-weight:400;letter-spacing:.4px}
.searchwrap{flex:1;min-width:180px;max-width:480px;margin-left:auto;position:relative}
#search{width:100%;padding:9px 16px;border:none;border-radius:22px;font-family:inherit;font-size:.92rem;background:rgba(255,255,255,.95);color:var(--ink);outline:none}
#search:focus{box-shadow:0 0 0 3px rgba(201,154,60,.6)}
.tools{display:flex;gap:6px;align-items:center}
.tbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:9px;padding:7px 11px;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.28)}
.tbtn.add{background:var(--gold);border-color:var(--gold);color:#3d2800}
/* ---------- layout ---------- */
.main{display:flex;flex:1;min-height:0}
nav.sidebar{width:var(--sidebar-w);flex:none;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px 60px}
nav.sidebar::-webkit-scrollbar{width:8px}
nav.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.content{flex:1;overflow-y:auto;padding:28px 34px 60px;min-width:0}
.view{max-width:860px;margin:0 auto}
/* ---------- sidebar ---------- */
.sidehome{display:flex;align-items:center;gap:8px;width:calc(100% - 4px);margin:0 0 12px;padding:8px 10px;background:none;border:none;border-left:3px solid var(--accent);font-size:.95rem;font-weight:700;color:var(--accent);cursor:pointer;border-radius:0 8px 8px 0}
.sidehome:hover{background:#faf6ef}
.cat{margin-bottom:4px;border-radius:10px;overflow:hidden}
.cat>button.cathead{width:100%;display:flex;align-items:center;gap:9px;padding:9px 12px;background:none;border:none;font-size:.95rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;border-radius:10px}
.cat>button.cathead:hover{background:var(--accent-soft)}
.cat.open>button.cathead{background:var(--accent-soft)}
.cat .num{flex:none;font-size:.66rem;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;letter-spacing:.5px}
.cat .arrow{margin-left:auto;transition:transform .2s;color:var(--muted);font-size:.72rem}
.cat.open>.cathead .arrow{transform:rotate(90deg)}
.subs{display:none}
.cat.open .subs{display:block}
.sub{display:flex;align-items:center;gap:8px;width:calc(100% - 14px);margin:2px 0 2px 14px;padding:6px 10px;background:none;border:none;border-left:2px solid var(--line);font-size:.85rem;color:var(--muted);cursor:pointer;text-align:left;border-radius:0 8px 8px 0}
.sub:hover{color:var(--accent);border-left-color:var(--gold);background:#faf6ef}
.sub.active{color:var(--accent);border-left-color:var(--accent);background:#faf6ef;font-weight:600}
.sub .sn{font-size:.64rem;color:var(--gold);font-weight:700;flex:none}
.sideside{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.minor{display:flex;align-items:center;gap:8px;padding:7px 10px;border:none;background:none;color:var(--muted);font-size:.82rem;cursor:pointer;border-radius:8px;text-align:left}
.minor:hover{background:#faf6ef;color:var(--accent)}
/* ---------- home grid ---------- */
.home-hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 28px;margin-bottom:24px;position:relative;overflow:hidden}
.home-hero::after{content:"✝";position:absolute;right:-10px;bottom:-30px;font-size:150px;color:var(--accent-soft);font-family:serif}
.home-hero h2{font-size:1.5rem;color:var(--accent);margin-bottom:6px}
.home-hero p{color:var(--muted);font-size:.95rem;max-width:580px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(120,80,30,.12);border-color:var(--gold)}
.card .cnum{font-size:.66rem;font-weight:700;color:#fff;background:var(--accent);align-self:flex-start;border-radius:6px;padding:2px 8px;letter-spacing:.5px}
.card h3{font-size:1.02rem;font-weight:600}
.card .cen{font-size:.73rem;color:var(--muted);font-style:italic}
.card .ccount{font-size:.72rem;color:var(--gold);font-weight:600;margin-top:auto}
/* ---------- topic page ---------- */
.crumb{font-size:.78rem;color:var(--muted);margin-bottom:18px;cursor:pointer;display:inline-block}
.crumb:hover{color:var(--accent)}
.topic-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:4px}
.badge{flex:none;margin-top:8px;font-size:.78rem;font-weight:700;color:#fff;background:var(--accent);border-radius:10px;padding:4px 11px;letter-spacing:.5px}
.topic-head h2{font-size:1.45rem;color:var(--ink);line-height:1.4}
.topic-en{font-size:.86rem;color:var(--muted);font-style:italic;margin:0 0 12px 62px}
.topic-desc{font-size:1.03rem;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:16px 20px;margin:12px 0 10px}
.topic-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.abtn{border:1px solid var(--line);background:var(--panel);color:var(--accent);font-size:.8rem;font-weight:600;border-radius:9px;padding:5px 13px;cursor:pointer}
.abtn:hover{border-color:var(--gold);background:#fdfaf4}
.abtn.danger{color:var(--danger)}
.abtn.danger:hover{border-color:var(--danger);background:#fdf3f3}
.sect{font-size:.85rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.verses{display:flex;flex-wrap:wrap;gap:8px}
.verse{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:.9rem;color:var(--ink)}
.relwrap{display:flex;flex-wrap:wrap;gap:8px}
.rel{background:var(--accent-soft);border:1px solid #e2cdb4;border-radius:10px;padding:6px 13px;font-size:.88rem;font-weight:600;color:var(--accent);cursor:pointer}
.rel:hover{background:#e8d5bd}
.child-list{display:flex;flex-direction:column;gap:8px}
.child{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
.child:hover{border-color:var(--gold);background:#fdfaf4}
.child .cn{font-size:.66rem;font-weight:700;color:var(--gold);flex:none;min-width:38px}
.child .ct{font-weight:600}
.child .ce{font-size:.72rem;color:var(--muted);font-style:italic}
.about{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);max-width:820px}
.about b{color:var(--ink)}
/* ---------- list view (collapsible) ---------- */
.lv-cat{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.lv-head{width:100%;display:flex;align-items:center;gap:12px;padding:13px 18px;background:none;border:none;cursor:pointer;text-align:left}
.lv-head:hover{background:#faf6ef}
.lv-head .num{font-size:.68rem;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px}
.lv-head .tt{font-weight:700;font-size:1.05rem;flex:1;min-width:0}
.lv-head .tt .ce{display:block;font-size:.7rem;color:var(--muted);font-style:italic;font-weight:400}
.lv-head .cnt{font-size:.72rem;color:var(--gold);font-weight:700}
.lv-head .arrow{color:var(--muted);font-size:.8rem;transition:transform .2s}
.lv-cat.open .lv-head{background:var(--accent-soft)}
.lv-cat.open .arrow{transform:rotate(180deg)}
.lv-body{display:none;border-top:1px solid var(--line)}
.lv-cat.open .lv-body{display:block;padding:10px 16px 16px}
.lv-major-desc{font-size:.92rem;color:var(--muted);margin-bottom:12px}
.lv-topic{border-left:2px solid var(--line);margin:4px 0 4px 6px;border-radius:0 10px 10px 0}
.lt-head{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;background:none;border:none;cursor:pointer;text-align:left;border-radius:8px}
.lt-head:hover{background:#faf6ef}
.lt-head .sn{font-size:.64rem;color:var(--gold);font-weight:700;min-width:38px}
.lt-head .ltt{flex:1;min-width:0;font-weight:600;font-size:.94rem;color:var(--ink)}
.lt-head .arrow{font-size:.7rem;color:var(--muted);transition:transform .2s}
.lv-topic.open .lt-head .arrow{transform:rotate(180deg)}
.lt-body{display:none;padding:4px 14px 14px 60px}
.lv-topic.open .lt-body{display:block}
.lt-desc{font-size:.92rem;margin-bottom:10px}
.lt-open{font-size:.75rem;color:var(--accent);cursor:pointer;font-weight:600}
/* ---------- search ---------- */
.noresult{padding:40px 0;text-align:center;color:var(--muted)}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(35,18,6,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:16px;max-width:620px;width:100%;padding:24px 24px 20px;box-shadow:0 18px 60px rgba(30,12,2,.4)}
.modal h3{color:var(--accent);margin-bottom:16px;font-size:1.15rem}
.mfield{margin-bottom:12px}
.mfield label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.mfield input,.mfield textarea,.mfield select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.92rem;color:var(--ink);background:#fff;outline:none}
.mfield input:focus,.mfield textarea:focus,.mfield select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,154,60,.25)}
.mfield textarea{resize:vertical;min-height:70px}
.mrow{display:flex;gap:12px}
.mrow .mfield{flex:1}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{border:none;border-radius:10px;padding:9px 22px;font-size:.9rem;font-weight:700;cursor:pointer}
.btn.save{background:var(--accent);color:#fff}
.btn.save:hover{background:var(--accent-dark)}
.btn.cancel{background:#efe9df;color:var(--muted)}
.merr{color:var(--danger);font-size:.8rem;margin-top:8px;display:none}
/* ---------- toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:24px;font-size:.88rem;opacity:0;pointer-events:none;transition:all .25s;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- mobile ---------- */
#menuBtn{display:none;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:4px 8px}
@media (max-width:860px){
  .content{padding:16px 12px 50px}
  nav.sidebar{position:fixed;top:0;left:0;bottom:0;z-index:20;transform:translateX(-105%);transition:transform .25s;box-shadow:4px 0 24px rgba(0,0,0,.18)}
  nav.sidebar.show{transform:none}
  #menuBtn{display:block}
  #scrim{position:fixed;inset:0;background:rgba(30,15,5,.4);z-index:15;display:none}
  #scrim.show{display:block}
  .topic-en{margin-left:0}
  .brand h1{font-size:.92rem}
  .brand .sub{display:none}
  .tbtn .tl{display:none}
  .tbtn{padding:8px 10px}
  .lt-body{padding-left:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="menuBtn" aria-label="మెనూ">☰</button>
    <div class="brand">
      <div class="logo">✝</div>
      <div>
        <h1>బైబిల్ విషయ సూచిక</h1>
        <div class="sub">BIBLE TOPICAL STUDY GUIDE · TELUGU</div>
      </div>
    </div>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="విషయాలను వెతకండి… (Search topics)" autocomplete="off">
    </div>
    <div class="tools">
      <button class="tbtn" id="viewBtn" title="వీక్షణ మార్చు (గ్రిడ్ / జాబితా)">☰ <span class="tl">జాబితా</span></button>
      <button class="tbtn add" id="addBtn" title="కొత్త విషయం చేర్చు">＋ <span class="tl">కొత్త విషయం</span></button>
      <button class="tbtn" id="backupBtn" title="బ్యాకప్ — ఫైల్‌గా భద్రపరచు">⬇ <span class="tl">బ్యాకప్</span></button>
      <button class="tbtn" id="restoreBtn" title="బ్యాకప్ ఫైల్ నుండి పునరుప్రాప్తి">⬆ <span class="tl">పునరుప్రాప్తి</span></button>
    </div>
  </header>
  <div class="main">
    <div id="scrim"></div>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- add/edit modal -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">కొత్త విషయం</h3>
    <div class="mrow">
      <div class="mfield"><label>విషయ సంఖ్య (ID)</label><input id="fId" type="number" step="1"></div>
      <div class="mfield"><label>ప్రధాన విభాగం</label><select id="fParent"></select></div>
    </div>
    <div class="mfield"><label>తెలుగు శీర్షిక *</label><input id="fTe" type="text" placeholder="ఉదా: దేవుని ప్రేమ"></div>
    <div class="mfield"><label>English title</label><input id="fEn" type="text" placeholder="e.g. Love of God"></div>
    <div class="mfield"><label>వివరణ</label><textarea id="fD" rows="4" placeholder="ఈ విషయం గురించిన సంక్షిప్త వివరణ…"></textarea></div>
    <div class="mfield"><label>ముఖ్య వచనాలు (ప్రతి వచనం ఒక లైన్‌లో)</label><textarea id="fV" rows="3" placeholder="యోహాను 3:16
కీర్తనలు 103:8"></textarea></div>
    <div class="mfield"><label>సంబంధిత విషయ సంఖ్యలు (కామాలతో, ఉదా: 1010, 1200)</label><input id="fR" type="text" placeholder="1010, 1200"></div>
    <div class="merr" id="merr"></div>
    <div class="modal-actions">
      <button class="btn cancel" id="mCancel">రద్దు</button>
      <button class="btn save" id="mSave">భద్రపరచు</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>

const LS_KEY = 'btg-data-v2';

function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(TOPICS)); return true; }
  catch(e){ toast('నిల్వ చేయడం విఫలమైంది'); return false; }
}
function persistUI(){ try{ localStorage.setItem(LS_UI, JSON.stringify(ui)); }catch(e){} }
function loadAll(){
  let t=null; try{ t=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  if(Array.isArray(t) && t.length && t.every(x=>x && typeof x.id==='number' && x.te)) TOPICS = t;
  else { TOPICS = deepCopy(BUILTIN); persist(); }
  let u=null; try{ u=JSON.parse(localStorage.getItem(LS_UI)||'null'); }catch(e){}
  if(u && u.mode) ui = Object.assign(ui, u);
}
function rebuild(){
  TOPICS.sort((a,b)=>a.id-b.id);
  BYID = {}; TOPICS.forEach(t=>BYID[t.id]=t);
  MAJORS = TOPICS.filter(t=>t.parent===null || t.parent===undefined).sort((a,b)=>a.id-b.id);
  MAJORS.forEach(m=>{ m.subs = TOPICS.filter(t=>t.parent===m.id).sort((a,b)=>a.id-b.id); });
}

      <div class="subs">

    </div>`).join('') + `
    <div class="sideside">
      <button class="minor" id="sideAdd">＋ కొత్త విషయం</button>

  sidebar.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{

    if(nav==='home') goHome(); else goTopic(+nav);

  sidebar.querySelectorAll('.cat>.cathead').forEach(b=>{

    <div class="home-hero">
      <h2>బైబిల్ ప్రధాన విషయాలు</h2>
      <p>తొమ్మిది ప్రధాన విభాగాలలో బైబిల్ ముఖ్య విషయాలు తెలుగులో. ప్రతి విషయాన్ని సవరించవచ్చు, కొత్త విషయాలు చేర్చవచ్చు, బ్యాకప్ తీసుకోవచ్చు. మీ మార్పులు ఈ పరికరంలో భద్రపరచబడతాయి.</p>
    </div>
    <div class="grid">${cards}</div>
    <div class="about"><b>గమనిక:</b> విషయ వర్గీకరణ ప్రమాణిత బైబిల్ విషయ వర్గీకరణ నమూనాను అనుసరిస్తుంది; వివరణలు, వచన ఎంపికలు స్వతంత్రంగా రాయబడ్డాయి.</div>
  </div>`;
  bindNav(content); content.scrollTop=0;
}

/* ================= list view (collapsible) ================= */
function renderList(){
  state={view:'list',id:null,q:''};
  const cats=MAJORS.map(m=>`
    <div class="lv-cat${ui.openCats.includes(m.id)?' open':''}" data-lvc="${m.id}">
      <button class="lv-head">
        <span class="num">${m.id}</span>
        <span class="tt">${m.te}<span class="ce">${m.en||''}</span></span>
        <span class="cnt">${m.subs.length}</span>
        <span class="arrow">▼</span>
      </button>
      <div class="lv-body">
        <div class="lv-major-desc">${m.d||''}</div>
        ${m.subs.map(s=>`
          <div class="lv-topic${ui.openTopics.includes(s.id)?' open':''}" data-lvt="${s.id}">
            <button class="lt-head">
              <span class="sn">${s.id}</span>
              <span class="ltt">${s.te}</span>
              <span class="arrow">▼</span>
            </button>
            <div class="lt-body">
              <div class="lt-desc">${s.d||''}</div>
              ${s.v&&s.v.length?`<div class="verses" style="margin-bottom:10px">${s.v.map(v=>`<span class="verse">${v}</span>`).join('')}</div>`:''}
              ${(s.r||[]).length?`<div class="relwrap" style="margin-bottom:10px">${s.r.map(r=>BYID[r]?`<span class="rel" data-nav="${r}">${BYID[r].te}</span>`:'').join('')}</div>`:''}
              <span class="lt-open" data-nav="${s.id}">↗ పూర్తి పేజీ</span> &nbsp;·&nbsp;
              <span class="lt-open" data-edit="${s.id}">✎ సవరించు</span> &nbsp;·&nbsp;
              <span class="lt-open" data-del="${s.id}" style="color:var(--danger)">✕ తొలగించు</span>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
  content.innerHTML=`<div class="view">
    <div class="sect">జాబితా వీక్షణం — విభాగాలు & విషయాలు (క్లిక్ చేసి తెరవండి)</div>
    ${cats}
    <div class="about">ప్రతి విభాగాన్ని, ప్రతి విషయాన్ని క్లిక్ చేసి విప్పుటకు వచ్చే సమాచారాన్ని చూడవచ్చు.</div>
  </div>`;
  content.querySelectorAll('.lv-head').forEach(b=>b.addEventListener('click',()=>{
    const c=b.closest('.lv-cat'); const id=+c.getAttribute('data-lvc');
    toggleIn(ui.openCats,id); c.classList.toggle('open'); persistUI();
  }));
  content.querySelectorAll('.lt-head').forEach(b=>b.addEventListener('click',()=>{
    const t=b.closest('.lv-topic'); const id=+t.getAttribute('data-lvt');
    toggleIn(ui.openTopics,id); t.classList.toggle('open'); persistUI();
  }));
  bindNav(content);
  content.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>openModal(+el.getAttribute('data-edit'))));
  content.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>deleteTopic(+el.getAttribute('data-del'))));
  content.scrollTop=0;
}

/* ================= topic page ================= */
function goTopic(id){
  const t=BYID[id]; if(!t) return goHome();
  state={view:'topic',id,q:''};
  const parent=t.parent?BYID[t.parent]:null;
  const children=t.subs||[];
  const rels=(t.r||[]).map(r=>BYID[r]).filter(Boolean);
  content.innerHTML=`<div class="view">
    <span class="crumb" data-nav="${parent?parent.id:'home'}">← ${parent?parent.te:'ప్రధాన పుటం'}</span>
    <div class="topic-head">
      <span class="badge">${t.id}</span>
      <h2>${t.te}</h2>
    </div>
    ${t.en?`<div class="topic-en">${t.en}</div>`:''}
    <div class="topic-desc">${t.d||''}</div>
    <div class="topic-actions">
      <button class="abtn" data-edit="${t.id}">✎ సవరించు</button>
      <button class="abtn" data-addsub="${t.id}">＋ ఉప విషయం</button>
      <button class="abtn danger" data-del="${t.id}">✕ తొలగించు</button>
    </div>
    ${t.v&&t.v.length?`<div class="sect">ముఖ్య వచనాలు</div><div class="verses">${t.v.map(v=>`<span class="verse">${v}</span>`).join('')}</div>`:''}
    ${children.length?`<div class="sect">ఉప విషయాలు</div><div class="child-list">
      ${children.map(c=>`<div class="child" data-nav="${c.id}"><span class="cn">${c.id}</span><span><span class="ct">${c.te}</span> <span class="ce">— ${c.en||''}</span></span></div>`).join('')}
    </div>`:''}
    ${rels.length?`<div class="sect">సంబంధిత విషయాలు</div><div class="relwrap">
      ${rels.map(r=>`<span class="rel" data-nav="${r.id}">${r.te}</span>`).join('')}
    </div>`:''}
    <div class="about">ఈ విషయం గురించి లోతుగా ధ్యానించడానికి పై వచనాలన్నింటినీ మీ బైబిల్‌లో చదవండి.</div>
  </div>`;
  bindNav(content);
  content.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>openModal(+el.getAttribute('data-edit'))));
  content.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>deleteTopic(+el.getAttribute('data-del'))));
  content.querySelectorAll('[data-addsub]').forEach(el=>el.addEventListener('click',()=>openModal(null, +el.getAttribute('data-addsub'))));
  highlightCat(id); content.scrollTop=0;
}
function highlightCat(id){
  const t=BYID[id]; const mid=t?(t.parent||id):null;
  sidebar.querySelectorAll('.cat').forEach(c=>c.classList.toggle('open', +c.getAttribute('data-cat')===mid));
  sidebar.querySelectorAll('.sub').forEach(s=>s.classList.toggle('active', +s.getAttribute('data-nav')===id));
}
function bindNav(root){
  root.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{
    const nav=el.getAttribute('data-nav');
    if(nav==='home') goHome(); else goTopic(+nav);
  }));
}

/* ================= search ================= */
function runSearch(q){
  q=q.trim().toLowerCase();
  if(!q){ goHome(); return; }
  state={view:'search',q};
  const hits=TOPICS.filter(t=>
    (t.te||'').toLowerCase().includes(q) || (t.en||'').toLowerCase().includes(q) ||
    (t.d||'').toLowerCase().includes(q) || String(t.id).includes(q));
  content.innerHTML=`<div class="view">
    <div class="sect">వెతుకుడు ఫలితాలు — “${q}” (${hits.length})</div>
    ${hits.length?hits.map(t=>`
      <div class="card" data-nav="${t.id}" style="flex-direction:row;align-items:center;gap:14px">
        <span class="cnum">${t.id}</span>
        <span style="flex:1;min-width:0">
          <span style="font-weight:600;display:block">${t.te}</span>
          <span style="font-size:.72rem;color:var(--muted);font-style:italic">${t.en||''}</span>
        </span>
      </div>`).join(''):`<div class="noresult">ఏమీ దొరకలేదు. వేరే పదంతో ప్రయత్నించండి.</div>`}
  </div>`;
  bindNav(content);
}

/* ================= add / edit modal ================= */
const modal=document.getElementById('modal');
function esc(s){return String(s==null?'':s);}
function openModal(id, presetParent){
  editingId=id||null;
  const t=id?BYID[id]:null;
  document.getElementById('modalTitle').textContent = t?'విషయం సవరించు':'కొత్త విషయం చేర్చు';
  document.getElementById('fId').value = t?t.id:suggestId(presetParent);
  document.getElementById('fTe').value = t?esc(t.te):'';
  document.getElementById('fEn').value = t?esc(t.en):'';
  document.getElementById('fD').value  = t?esc(t.d):'';
  document.getElementById('fV').value  = t?(t.v||[]).join('\n'):'';
  document.getElementById('fR').value  = t?(t.r||[]).join(', '):'';
  // parent select
  const sel=document.getElementById('fParent');
  const cur=t?t.parent:(presetParent!=null?presetParent:(MAJORS.length?MAJORS[0].id:null));
  sel.innerHTML=`<option value="">— లేదు (ఇదే ప్రధాన విభాగం)</option>`+
    MAJORS.map(m=>`<option value="${m.id}" ${cur===m.id?'selected':''}>${m.id} · ${m.te}</option>`).join('');
  sel.value = cur==null?'':String(cur);
  document.getElementById('merr').style.display='none';
  modal.classList.add('show');
  setTimeout(()=>document.getElementById('fTe').focus(),50);
}
function closeModal(){ modal.classList.remove('show'); }
function suggestId(presetParent){
  if(presetParent!=null && BYID[presetParent]){
    const kids=TOPICS.filter(t=>t.parent===presetParent).map(t=>t.id);
    const base=presetParent, cap=base+1000;
    let s=kids.length?Math.max(...kids)+10:base+10;
    while(BYID[s] && s<cap) s+=10;
    if(!BYID[s] && s<cap) return s;
    for(let i=base+1;i<cap;i++) if(!BYID[i]) return i;
    return base+1;
  }
  if(MAJORS.length){ let m=Math.max(...MAJORS.map(x=>x.id))+1000; while(BYID[m])m+=10; return m; }
  return 1000;
}
function saveFromForm(){
  const id=parseInt(document.getElementById('fId').value,10);
  const te=document.getElementById('fTe').value.trim();
  const en=document.getElementById('fEn').value.trim();
  const d=document.getElementById('fD').value.trim();
  const v=document.getElementById('fV').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const r=(document.getElementById('fR').value.match(/\d+/g)||[]).map(Number).filter(x=>x!==id);
  const parentRaw=document.getElementById('fParent').value;
  const parent=parentRaw===''?null:parseInt(parentRaw,10);
  const err=document.getElementById('merr');
  if(!Number.isInteger(id)||id<1){ err.textContent='దయచేసి సరైన విషయ సంఖ్య ఇవ్వండి.'; err.style.display='block'; return; }
  if(BYID[id] && id!==editingId){ err.textContent='ఈ సంఖ్య ఇప్పటికే ఉంది. వేరే సంఖ్య ఇవ్వండి.'; err.style.display='block'; return; }
  if(!te){ err.textContent='దయచేసి తెలుగు శీర్షిక ఇవ్వండి.'; err.style.display='block'; return; }
  const rec={id,te,en,d,v,r,parent};
  const i=TOPICS.findIndex(t=>t.id===editingId);
  if(i>=0) TOPICS[i]=rec; else TOPICS.push(rec);
  persist(); rebuild(); renderSidebar(); closeModal();
  goTopic(id); toast('భద్రపరచబడింది');
}
function deleteTopic(id){
  const t=BYID[id]; if(!t) return;
  const hasKids=(t.subs&&t.subs.length>0);
  const msg=hasKids
    ?`“${t.te}” (${id}) విభాగంలో ${t.subs.length} ఉప విషయాలున్నాయి. తొలగిస్తే అవి ప్రధాన విభాగం లేని విషయాలుగా మారతాయి. తొలగించాలా?`
    :`“${t.te}” (${id}) విషయాన్ని తొలగించాలా?`;
  if(!confirm(msg)) return;
  TOPICS=TOPICS.filter(t=>t.id!==id);
  if(hasKids) TOPICS.forEach(x=>{ if(x.parent===id) x.parent=null; });
  TOPICS.forEach(x=>{ if(x.r) x.r=x.r.filter(r=>r!==id); });
  persist(); rebuild(); renderSidebar(); goHome(); toast('తొలగించబడింది');
}

/* ================= backup / restore ================= */
function backupPayload(){
  return JSON.stringify({app:'btg',version:2,savedAt:new Date().toISOString(),topics:TOPICS},null,1);
}
async function backup(){
  const name='bible-topical-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const data=backupPayload();
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:name,
        types:[{description:'JSON బ్యాకప్',accept:{'application/json':['.json']}}]});
      const w=await h.createWritable(); await w.write(data); await w.close();
      toast('బ్యాకప్ భద్రపరచబడింది'); return;
    }catch(e){ if(e && e.name==='AbortError') return; /* fall through */ }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  toast('బ్యాకప్ డౌన్‌లోడ్ అయింది');
}
function applyRestored(topics){
  const clean=topics.filter(t=>t&&typeof t.id==='number'&&t.te).map(t=>({
    id:t.id, te:String(t.te), en:t.en||'', d:t.d||'',
    v:Array.isArray(t.v)?t.v.map(String):[],
    r:Array.isArray(t.r)?t.r.filter(x=>typeof x==='number'):[],
    parent:(typeof t.parent==='number')?t.parent:null }));
  if(!clean.length) throw new Error('empty');
  TOPICS=clean; persist(); rebuild(); renderSidebar(); goHome();
  toast('బ్యాకప్ పునరుప్రాప్తి పూర్తయింది — '+clean.length+' విషయాలు');
}
function doRestoreFile(file){
  file.text().then(txt=>{
    const data=JSON.parse(txt);
    const topics=Array.isArray(data)?data:(Array.isArray(data.topics)?data.topics:null);
    if(!topics) throw new Error('bad');
    applyRestored(topics);
  }).catch(()=>toast('బ్యాకప్ ఫైల్ చదవడం సాధ్యం కాలేదు — సరైన ఫైలా చూడండి'));
}
async function restore(){
  if(!confirm('బ్యాకప్ ఫైల్‌లోని డేటా ప్రస్తుత డేటా స్థానంలో వస్తుంది. కొనసాగించాలా?')) return;
  if(window.showOpenFilePicker){
    try{
      const [h]=await window.showOpenFilePicker({types:[{description:'JSON బ్యాకప్',accept:{'application/json':['.json']}}]});
      doRestoreFile(await h.getFile()); return;
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ if(inp.files&&inp.files[0]) doRestoreFile(inp.files[0]); };
  inp.click();
}

/* ================= view toggle & misc ================= */
function setMode(m){
  ui.mode=m; persistUI();
  const btn=document.getElementById('viewBtn');
  btn.innerHTML = m==='grid' ? '☰ <span class="tl">జాబితా</span>' : '▦ <span class="tl">గ్రిడ్</span>';
  if(state.view==='home'||state.view==='list'||state.view==='search') goHome(); else goTopic(state.id);
}
let searchTimer;
searchEl.addEventListener('input',e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>runSearch(e.target.value),180);
});
document.getElementById('addBtn').addEventListener('click',()=>openModal(null));
document.getElementById('backupBtn').addEventListener('click',backup);
document.getElementById('restoreBtn').addEventListener('click',restore);
document.getElementById('viewBtn').addEventListener('click',()=>setMode(ui.mode==='grid'?'list':'grid'));
document.getElementById('mSave').addEventListener('click',saveFromForm);
document.getElementById('mCancel').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

const scrim=document.getElementById('scrim');
function closeSidebarMobile(){ sidebar.classList.remove('show'); scrim.classList.remove('show'); }
document.getElementById('menuBtn').addEventListener('click',()=>{ sidebar.classList.toggle('show'); scrim.classList.toggle('show'); });
scrim.addEventListener('click',closeSidebarMobile);

/* ================= init ================= */
loadAll(); rebuild(); renderSidebar(); setMode(ui.mode); goHome();

</script>
