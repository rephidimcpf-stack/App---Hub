<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hands of Hope — Beneficiary & Fund Manager</title>
<style>
  :root{
    --primary:#0f766e; --primary-dark:#115e59; --primary-light:#ccfbf1;
    --accent:#b45309; --bg:#f4f6f5; --card:#ffffff; --border:#e2e8e6;
    --text:#1f2937; --muted:#6b7280; --danger:#b91c1c; --ok:#15803d;
    --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  .hidden{display:none!important}

  /* ---------- PIN screen ---------- */
  #pinScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f766e,#134e4a);padding:16px}
  .pin-card{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
  .pin-card h1{font-size:20px;color:var(--primary-dark);margin-bottom:4px}
  .pin-card p{color:var(--muted);font-size:13px;margin-bottom:20px}
  .pin-card input{width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:18px;text-align:center;letter-spacing:6px;margin-bottom:12px}
  .pin-card input:focus{outline:none;border-color:var(--primary)}

  /* ---------- Layout ---------- */
  #app{display:flex;min-height:100vh}
  aside{width:230px;background:#0b3d38;color:#d1fae5;padding:20px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
  aside .logo{font-size:17px;font-weight:700;color:#fff;padding:6px 10px 18px;line-height:1.3}
  aside .logo small{display:block;font-weight:400;font-size:11px;color:#99f6e4;margin-top:3px}
  .navbtn{display:block;width:100%;text-align:left;background:none;border:none;color:#a7f3d0;padding:11px 12px;border-radius:9px;font-size:14px;cursor:pointer;font-family:inherit}
  .navbtn:hover{background:rgba(255,255,255,.08)}
  .navbtn.active{background:var(--primary);color:#fff;font-weight:600}
  aside .spacer{flex:1}
  main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%}
  h2.view-title{font-size:22px;margin-bottom:18px;color:var(--primary-dark)}
  .subtitle{color:var(--muted);font-size:13px;margin:-14px 0 18px}

  /* ---------- Components ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .stat .num{font-size:24px;font-weight:700;color:var(--primary-dark)}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}
  .btn{display:inline-block;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--primary-dark)}
  .btn.secondary{background:#fff;color:var(--primary-dark);border:1.5px solid var(--primary)}
  .btn.danger{background:var(--danger)}
  .btn.small{padding:6px 12px;font-size:12.5px;border-radius:7px}
  .btn.ghost{background:transparent;border:none;color:var(--danger);font-weight:600;cursor:pointer;font-family:inherit;font-size:13px;padding:6px 8px}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
  label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin:0 0 5px}
  .field{margin-bottom:14px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--border)}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .b-orphan{background:#ede9fe;color:#6d28d9}.b-widow{background:#fce7f3;color:#be185d}
  .b-poor{background:#fef3c7;color:#b45309}.b-disabled{background:#e0f2fe;color:#075985}
  .b-evangelist{background:#dcfce7;color:#15803d}.b-believer{background:#f1f5f9;color:#334155}
  .b-pastor{background:#ffe4e6;color:#9f1239}
  .st-active{background:#dcfce7;color:#15803d}.st-hold{background:#fef9c3;color:#a16207}.st-closed{background:#f3f4f6;color:#6b7280}
  .amt{font-weight:700;color:var(--primary-dark);white-space:nowrap}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar input[type=text]{flex:1;min-width:180px}
  .toolbar select{width:auto;min-width:130px}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
  .muted{color:var(--muted);font-size:12.5px}
  .link{color:var(--primary);cursor:pointer;text-decoration:underline;font-weight:600}
  .detail-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
  .kv{font-size:13.5px;margin-bottom:5px}
  .kv b{color:var(--muted);font-weight:600}

  /* ---------- Modal ---------- */
  #modalOverlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;overflow-y:auto}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:92vh;overflow-y:auto}
  .modal h3{font-size:17px;color:var(--primary-dark);margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  /* ---------- Mobile ---------- */
  .bottom-nav{display:none}
  @media(max-width:800px){
    aside{display:none}
    main{padding:16px 14px 90px}
    .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0b3d38;z-index:40;padding:6px 4px}
    .bottom-nav button{flex:1;background:none;border:none;color:#a7f3d0;font-size:11px;font-family:inherit;cursor:pointer;padding:8px 2px;border-radius:8px}
    .bottom-nav button.active{background:var(--primary);color:#fff}
    .grid2{grid-template-columns:1fr}
    table{font-size:13px}
    td,th{padding:8px 6px}
    .hide-sm{display:none}
  }

  /* ---------- Print ---------- */
  @media print{
    aside,.bottom-nav,.toolbar,.btn,button,#modalOverlay{display:none!important}
    main{padding:0;max-width:none}
    body{background:#fff}
    .stat,.card{box-shadow:none}
  }

  /* ---------- Pro polish ---------- */
  body{font-family:Inter,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(180deg,#eef4f2 0,#f6f8f7 260px)}
  aside{background:linear-gradient(180deg,#0b3d38,#082f2b);box-shadow:2px 0 14px rgba(0,0,0,.12)}
  aside .logo{display:flex;flex-direction:column;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px}
  .navbtn{transition:.15s;display:flex;align-items:center;gap:10px}
  .navbtn i{font-style:normal;width:22px;text-align:center}
  .navbtn.active{box-shadow:0 4px 12px rgba(15,118,110,.45)}
  .bottom-nav button span{display:block;font-size:17px}
  h2.view-title{font-weight:800;letter-spacing:-.3px}
  .card,.stat{transition:box-shadow .2s,transform .2s}
  .stat{position:relative;overflow:hidden;padding-top:18px}
  .stat:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--primary)}
  .stat:nth-child(2):before{background:#0ea5e9}.stat:nth-child(3):before{background:#b45309}.stat:nth-child(4):before{background:#7c3aed}.stat:nth-child(5):before{background:#16a34a}.stat:nth-child(6):before{background:#dc2626}
  .stat:hover,.card:hover{box-shadow:0 8px 22px rgba(16,24,40,.1)}
  .stat .num{font-size:25px;letter-spacing:-.5px}
  .btn{transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.12)}.btn:hover{transform:translateY(-1px)}
  tbody tr:hover{background:#f5faf9}
  .hero{background:linear-gradient(120deg,#0f766e,#134e4a 70%);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;box-shadow:0 10px 26px rgba(15,118,110,.28)}
  .hero-t{font-size:24px;font-weight:800}.hero-sm{font-size:13px;opacity:.85}
  .hero .btn{box-shadow:none}.hero .btn.secondary{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.5)}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:800px){.two{grid-template-columns:1fr}}
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
  .bpair{display:flex;gap:3px;align-items:flex-end;height:calc(100% - 18px);width:100%;justify-content:center}
  .bar{width:42%;max-width:26px;border-radius:5px 5px 0 0;background:var(--primary);min-height:2px}.bar.r{background:#f59e0b}
  .legend{font-size:12px;color:var(--muted);margin-top:8px}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:middle}
  .prow{margin-bottom:11px;font-size:13px}.prow .pt{display:flex;justify-content:space-between;margin-bottom:4px}
  .prog{height:8px;border-radius:99px;background:#e6efed;overflow:hidden}.prog>div{height:100%;background:linear-gradient(90deg,#14b8a6,#0f766e);border-radius:99px}
  .tl{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}.tl:last-child{border-bottom:none}
  .tl-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0;box-shadow:0 0 0 4px var(--primary-light)}
  .who{display:flex;gap:11px;align-items:center}.who .avatar{width:38px;height:38px;font-size:14px}
  .ic{text-decoration:none;font-size:15px;margin-right:4px}
  #toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%)}
  .letterhead{text-align:center;border-bottom:3px double #0f766e;padding-bottom:10px;margin-bottom:16px}
  .letterhead h1{font-size:22px;color:#0f766e}.letterhead div{font-size:12px;color:#444}
  .print-only,#printArea{display:none}
  .rcpt{max-width:720px;margin:0 auto;border:2px solid #0f766e;padding:26px;font-size:14px;line-height:1.7}
  .rcpt h2{text-align:center;margin:6px 0 14px;letter-spacing:1px}
  .rcpt .meta{display:flex;justify-content:space-between;margin-bottom:12px}
  .rcpt .sig{display:flex;justify-content:space-between;margin-top:60px;font-size:12.5px}.rcpt .sig div{border-top:1px solid #333;padding-top:4px;min-width:200px;text-align:center}
  #pinScreen{background:radial-gradient(circle at 20% 10%,#14b8a6,#0f766e 40%,#042f2e)}
  @media print{.print-only{display:block}body.pr #app,body.pr #pinScreen{display:none!important}body.pr #printArea{display:block!important}.hero,#toast{display:none!important}}
</style>
</head>
<body>

<!-- PIN / setup screen -->
<div id="pinScreen" class="hidden">
  <div class="pin-card">
    <h1 id="pinTitle">Hands of Hope</h1>
    <p id="pinMsg">Enter your PIN to open the records</p>
    <div id="pinSetup" class="hidden">
      <div class="field"><label>New PIN (4+ digits)</label><input type="password" id="pinNew1" inputmode="numeric" maxlength="8"></div>
      <div class="field"><label>Confirm PIN</label><input type="password" id="pinNew2" inputmode="numeric" maxlength="8"></div>
      <button class="btn" style="width:100%" onclick="savePin()">Save PIN</button>
      <button class="btn secondary" style="width:100%;margin-top:8px" onclick="skipPin()">Skip — no PIN for now</button>
    </div>
    <div id="pinEntry">
      <input type="password" id="pinInput" inputmode="numeric" maxlength="8" placeholder="••••">
      <button class="btn" style="width:100%" onclick="tryPin()">Unlock</button>
      <p class="muted" style="margin-top:12px">Forgot the PIN? Clear this site's browser data to reset.</p>
    </div>
  </div>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <aside>
    <div class="logo"><span id="sideName">Hands of Hope</span><small>Beneficiary & Fund Manager</small></div>
    <button class="navbtn" data-view="dashboard" onclick="showView('dashboard')"><i>📊</i>Dashboard</button>
    <button class="navbtn" data-view="beneficiaries" onclick="showView('beneficiaries')"><i>👥</i>Beneficiaries</button>
    <button class="navbtn" data-view="support" onclick="showView('support')"><i>💰</i>Funds</button>
    <button class="navbtn" data-view="reports" onclick="showView('reports')"><i>📑</i>Reports</button>
    <button class="navbtn" data-view="settings" onclick="showView('settings')"><i>⚙️</i>Settings</button>
    <div class="spacer"></div>
    <button class="navbtn" onclick="lockApp()"><i>🔒</i>Lock</button>
  </aside>
  <main id="main"></main>
  <nav class="bottom-nav">
    <button data-view="dashboard" onclick="showView('dashboard')"><span>🏠</span>Home</button>
    <button data-view="beneficiaries" onclick="showView('beneficiaries')"><span>👥</span>People</button>
    <button data-view="support" onclick="showView('support')"><span>💰</span>Funds</button>
    <button data-view="reports" onclick="showView('reports')"><span>📑</span>Reports</button>
    <button data-view="settings" onclick="showView('settings')"><span>⚙️</span>Settings</button>
  </nav>
</div>

<div id="modalOverlay" class="hidden"></div>
<div id="printArea"></div>

<script>
"use strict";
/* ============================ Data ============================ */
const DEFAULT_CATEGORIES = ["Orphan","Widow","Poor / Needy","Disabled","Evangelist","Needy Believer","Pastor"];
const MODES = ["Cash","Bank Transfer","UPI","In Kind"];
const PURPOSES = ["Food","Medical","Education","Rent / Housing","Clothing","Ministry / Evangelism","Emergency","Other"];
const STATUSES = ["Active","On Hold","Closed"];
const LS_KEY = "handsOfHopeData_v1";

let state = { pin:"", ngoName:"Hands of Hope", categories:[], beneficiaries:[], supports:[], receipts:[], visits:[], org:{}, lastBackupAt:"" };
let currentView = "dashboard";
let filters = { q:"", category:"", status:"", q2:"", from:"", to:"" };
let fundTab = "given";
let currentDetailId = null;

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function load(){ try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d = JSON.parse(raw); state = Object.assign(state, d);} }catch(e){ console.warn("load failed", e); } if(!Array.isArray(state.categories) || !state.categories.length){ state.categories = DEFAULT_CATEGORIES.slice(); } if(!Array.isArray(state.receipts)) state.receipts = []; if(!Array.isArray(state.visits)) state.visits = []; if(!state.org || typeof state.org!=="object") state.org = {}; state.beneficiaries.forEach(b=>{ if(!b.regNo) b.regNo = nextReg(); }); }
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); toast("Saved \u2713"); }catch(e){ alert("Could not save — browser storage may be full. Please export a backup."); } }
function toast(m){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); } t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1600); }
function nextReg(){ const n = state.beneficiaries.reduce((m,b)=>Math.max(m, parseInt((b.regNo||"").replace(/\D/g,""))||0),0)+1; return "HOH-"+String(n).padStart(4,"0"); }
function renderKeep(id){ renderCurrent(); const e=document.getElementById(id); if(e){ e.focus(); const l=e.value.length; e.setSelectionRange(l,l); } }
function inWords(n){ n=Math.floor(Number(n)||0); if(!n) return "Zero"; const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"]; const two=x=>x<20?a[x]:t[Math.floor(x/10)]+(x%10?" "+a[x%10]:""); const three=x=>(x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):""); let o=""; const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3; if(cr)o+=three(cr)+" Crore "; if(lk)o+=two(lk)+" Lakh "; if(th)o+=two(th)+" Thousand "; if(n)o+=three(n); return o.trim(); }
function letterhead(){ const o=state.org||{}; return `<div class="letterhead"><h1>${esc(state.ngoName)}</h1>${o.address?`<div>${esc(o.address)}</div>`:""}<div>${[o.phone&&"Phone: "+esc(o.phone),o.email&&esc(o.email),o.regNo&&"Reg. No: "+esc(o.regNo)].filter(Boolean).join(" · ")}</div></div>`; }
window.addEventListener("afterprint",()=>document.body.classList.remove("pr"));
function esc(s){
  const S = String.fromCharCode, M = {};
  M[S(38)] = S(38) + "amp;";
  M[S(60)] = S(38) + "lt;";
  M[S(62)] = S(38) + "gt;";
  M[S(34)] = S(38) + "quot;";
  M[S(39)] = S(38) + "#39;";
  return String(s ?? "").replace(/[&<>"']/g, c => M[c]);
}
function money(n){ return "\u20B9" + Number(n||0).toLocaleString("en-IN"); }
function fmtDate(iso){ if(!iso) return "—"; const p = iso.split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
const CAT_PALETTES = [["#ede9fe","#6d28d9"],["#fce7f3","#be185d"],["#fef3c7","#b45309"],["#e0f2fe","#075985"],["#dcfce7","#15803d"],["#f1f5f9","#334155"],["#ffe4e6","#9f1239"],["#ecfeff","#155e75"],["#fef2f2","#991b1b"],["#f0fdf4","#166534"]];
function catColor(c){
  let h = 0; for(let i=0;i<c.length;i++) h = (h*31 + c.charCodeAt(i)) >>> 0;
  return CAT_PALETTES[h % CAT_PALETTES.length];
}
function catBadge(c){
  const slug = c.toLowerCase().split(" ")[0].replace("/","");
  if(DEFAULT_CATEGORIES.indexOf(c) !== -1) return '<span class="badge b-'+esc(slug)+'">'+esc(c)+'</span>';
  const p = catColor(c);
  return '<span class="badge" style="background:'+p[0]+';color:'+p[1]+'">'+esc(c)+'</span>';
}
function statusBadge(s){ return '<span class="badge st-'+esc(s.toLowerCase().split(" ")[0])+'">'+esc(s)+'</span>'; }
function ben(id){ return state.beneficiaries.find(b => b.id === id); }
function benName(id){ const b = ben(id); return b ? b.name : "(deleted)"; }
function totalFor(id){ return state.supports.filter(s => s.beneficiaryId === id).reduce((a,s)=>a+Number(s.amount||0),0); }
function countFor(id){ return state.supports.filter(s => s.beneficiaryId === id).length; }
function initials(n){ return (n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }

/* ============================ PIN gate ============================ */
function initPin(){
  const scr = $("#pinScreen");
  scr.classList.remove("hidden");
  $("#app").classList.add("hidden");
  $("#pinTitle").textContent = state.ngoName || "Hands of Hope";
  if(!state.pin){
    $("#pinMsg").textContent = "First time here — set a PIN to protect these records";
    $("#pinSetup").classList.remove("hidden");
    $("#pinEntry").classList.add("hidden");
  }else{
    $("#pinMsg").textContent = "Enter your PIN to open the records";
    $("#pinSetup").classList.add("hidden");
    $("#pinEntry").classList.remove("hidden");
    $("#pinInput").value = "";
    setTimeout(()=>$("#pinInput").focus(), 50);
  }
}
function savePin(){
  const a = $("#pinNew1").value, b = $("#pinNew2").value;
  if(a.length < 4){ alert("PIN must be at least 4 digits."); return; }
  if(a !== b){ alert("PINs do not match."); return; }
  state.pin = a; persist(); openApp();
}
function skipPin(){ state.pin = ""; persist(); openApp(); }
function tryPin(){
  if($("#pinInput").value === state.pin){ openApp(); }
  else{ alert("Incorrect PIN."); $("#pinInput").value = ""; }
}
function openApp(){ $("#pinScreen").classList.add("hidden"); $("#app").classList.remove("hidden"); renderCurrent(); }
function lockApp(){ initPin(); }

/* ============================ Views ============================ */
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return document.querySelectorAll(sel); }

function showView(v){
  currentView = v;
  $all(".navbtn, .bottom-nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  renderCurrent();
  window.scrollTo(0,0);
}
function renderCurrent(){
  const m = $("#main");
  if(currentView === "dashboard") m.innerHTML = viewDashboard();
  else if(currentView === "beneficiaries") m.innerHTML = viewBeneficiaries();
  else if(currentView === "support") m.innerHTML = viewSupport();
  else if(currentView === "reports") m.innerHTML = viewReports();
  else if(currentView === "settings") m.innerHTML = viewSettings();
  else if(currentView === "detail") m.innerHTML = viewDetail(currentDetailId);
  $("#sideName").textContent = state.ngoName || "Hands of Hope";
}

/* ============================ Dashboard ============================ */

  const active = bens.filter(b=>b.status==="Active").length;
  const total = state.supports.reduce((a,s)=>a+Number(s.amount||0),0);
  const received = state.receipts.reduce((a,r)=>a+Number(r.amount||0),0);
  const ym = todayISO().slice(0,7);
  const thisMonth = state.supports.filter(s=>(s.date||"").slice(0,7)===ym).reduce((a,s)=>a+Number(s.amount||0),0);
  const recent = [...state.supports].sort((a,b)=> (b.date||"").localeCompare(a.date||"")).slice(0,6);
  const today = todayISO();
  const soon = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const fups = bens.filter(b=>b.followUp && b.followUp<=soon && b.status!=="Closed").sort((a,b)=>a.followUp.localeCompare(b.followUp));

  ${needsBackup?`
  <div class="card" style="margin-bottom:18px;border-color:#fcd34d;background:#fffbeb">
    <b>Backup reminder:</b> ${state.lastBackupAt ? "it has been more than a month since your last backup." : "you have never exported a backup yet."}
    <button class="btn small" style="margin-left:10px" onclick="exportJSON()">Backup now</button>
  </div>`:""}
  <div class="stat-grid">
    <div class="stat"><div class="num">${bens.length}</div><div class="lbl">Total beneficiaries</div></div>
    <div class="stat"><div class="num">${active}</div><div class="lbl">Active now</div></div>
    <div class="stat"><div class="num">${money(total)}</div><div class="lbl">Total support given</div></div>
    <div class="stat"><div class="num">${money(thisMonth)}</div><div class="lbl">Given this month</div></div>
    <div class="stat"><div class="num">${money(received)}</div><div class="lbl">Funds received</div></div>
    <div class="stat"><div class="num" ${overdue?'style="color:var(--danger)"':''}>${overdue}</div><div class="lbl">Follow-ups overdue</div></div>
  </div>
  ${fups.length?`
  <h3 style="color:var(--primary-dark);margin:4px 0 10px">Follow-ups (next 7 days and overdue)</h3>
  <div class="card" style="padding:6px 12px;margin-bottom:20px">
    <table><tbody>
      ${fups.map(b=>`<tr>
        <td><span class="link" onclick="goDetail('${b.id}')">${esc(b.name)}</span><div class="muted">${catBadge(b.category)}</div></td>
        <td style="white-space:nowrap">${b.followUp<today ? '<span class="badge" style="background:#fee2e2;color:#b91c1c">Overdue — '+fmtDate(b.followUp)+'</span>' : '<span class="badge st-active">'+fmtDate(b.followUp)+'</span>'}</td>
        <td style="text-align:right"><button class="btn small secondary" onclick="followUpDone('${b.id}')">Done</button></td>
      </tr>`).join("")}
    </tbody></table>
  </div>`:""}

    </div>
  </div>
  <div class="card" style="padding:6px 12px">
    ${ recent.length ? `<table><thead><tr><th>Date</th><th>Beneficiary</th><th class="hide-sm">Purpose</th><th style="text-align:right">Amount</th></tr></thead><tbody>
      ${recent.map(s=>`<tr>
        <td style="white-space:nowrap">${fmtDate(s.date)}</td>
        <td><span class="link" onclick="goDetail('${s.beneficiaryId}')">${esc(benName(s.beneficiaryId))}</span></td>

      </tr>`).join("")}

  </div>
  ${catRows.length ? `
  <h3 style="color:var(--primary-dark);margin:22px 0 10px">By category</h3>

function filteredBeneficiaries(){
  const q = filters.q.trim().toLowerCase();
  return state.beneficiaries
    .filter(b => (!filters.category || b.category === filters.category))
    .filter(b => (!filters.status || b.status === filters.status))
    .filter(b => !q || [b.name,b.phone,b.location,b.notes,b.regNo].join(" ").toLowerCase().includes(q))
    .sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""));
}
function dashCharts(){
  const mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], now=new Date(), ms=[];
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); ms.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  const sum=(arr,m)=>arr.filter(x=>(x.date||"").slice(0,7)===m).reduce((a,x)=>a+Number(x.amount||0),0);
  const g=ms.map(m=>sum(state.supports,m)), r=ms.map(m=>sum(state.receipts,m)), mx=Math.max(1,...g,...r);
  const tot=state.supports.reduce((a,s)=>a+Number(s.amount||0),0);
  const cats=state.categories.map(c=>({c,amt:state.supports.filter(s=>{const b=ben(s.beneficiaryId);return b&&b.category===c;}).reduce((a,s)=>a+Number(s.amount||0),0)})).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);
  return `<div class="two">
  <div class="card"><h3 style="color:var(--primary-dark);margin-bottom:8px">Last 6 months</h3>
    <div class="bars">${ms.map((m,i)=>`<div class="bcol"><div class="bpair"><div class="bar" title="Given ${money(g[i])}" style="height:${g[i]/mx*100}%"></div><div class="bar r" title="Received ${money(r[i])}" style="height:${r[i]/mx*100}%"></div></div>${mn[Number(m.slice(5))-1]}</div>`).join("")}</div>
    <div class="legend"><b style="background:var(--primary)"></b>Given<b style="background:#f59e0b"></b>Received</div></div>
  <div class="card"><h3 style="color:var(--primary-dark);margin-bottom:12px">Support by category</h3>
    ${cats.length?cats.map(x=>`<div class="prow"><div class="pt"><span>${esc(x.c)}</span><b>${money(x.amt)}</b></div><div class="prog"><div style="width:${Math.round(x.amt*100/tot)}%"></div></div></div>`).join(""):'<div class="empty">Chart appears once support is recorded.</div>'}</div></div>`;
}
function viewBeneficiaries(){
  const list=filteredBeneficiaries(), so=filters.sort||"new";
  if(so==="name") list.sort((a,b)=>a.name.localeCompare(b.name)); else if(so==="amt") list.sort((a,b)=>totalFor(b.id)-totalFor(a.id));
  const lastGift=id=>{ const d=state.supports.filter(s=>s.beneficiaryId===id).map(s=>s.date||"").sort().pop(); return d?fmtDate(d):"\u2014"; };

    <select onchange="filters.category=this.value;renderCurrent()"><option value="">All categories</option>${state.categories.map(c=>`<option ${c===filters.category?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select onchange="filters.status=this.value;renderCurrent()"><option value="">All status</option>${STATUSES.map(c=>`<option ${c===filters.status?"selected":""}>${c}</option>`).join("")}</select>

    <button class="btn secondary" onclick="exportCSV('beneficiaries')">Export CSV</button>
    <button class="btn" onclick="openBeneficiaryModal()">+ Register</button>
  </div>
  <div class="card" style="padding:6px 12px">${list.length?`<table><thead><tr><th>Person</th><th>Category</th><th class="hide-sm">Status</th><th class="hide-sm">Contact</th><th class="hide-sm">Last gift</th><th style="text-align:right">Total</th></tr></thead><tbody>
  ${list.map(b=>`<tr><td><div class="who"><div class="avatar">${esc(initials(b.name))}</div><div><span class="link" onclick="goDetail('${b.id}')">${esc(b.name)}</span><div class="muted">${esc(b.regNo||"")}${b.location?" \u00b7 "+esc(b.location):""}</div></div></div></td>

function purposeTable(){

function saveBeneficiary(id){
  const name = $("#f_name").value.trim();
  if(!name){ alert("Please enter a name."); return; }
  if(!id && state.beneficiaries.some(x=>x.name.toLowerCase()===name.toLowerCase()) && !confirm("Someone named \""+name+"\" is already registered. Add anyway?")) return;
  const cat = $("#f_cat").value;
  if(!cat || cat === "__new__"){ alert("Please choose a category."); return; }
  const rec = {
    id: id || uid("b"),
    name, category: cat, status: $("#f_status").value,
    gender: $("#f_gender").value, age: $("#f_age").value ? Number($("#f_age").value) : "",
    phone: $("#f_phone").value.trim(), family: $("#f_family").value, regNo: id ? (ben(id).regNo||nextReg()) : nextReg(), location: $("#f_loc").value.trim(),
    joinedDate: $("#f_joined").value || todayISO(), followUp: $("#f_followup").value || "", notes: $("#f_notes").value.trim(),
    createdAt: id ? (ben(id).createdAt||new Date().toISOString()) : new Date().toISOString()
  };
  if(id){ const i = state.beneficiaries.findIndex(b=>b.id===id); state.beneficiaries[i]=rec; }
  else state.beneficiaries.push(rec);
  persist(); closeModal(); renderCurrent();
}
function deleteBeneficiary(id){
  const b = ben(id); if(!b) return;
  const n = countFor(id);
  if(!confirm(`Delete ${b.name}?` + (n?`\n\nTheir ${n} support entries (total ${money(totalFor(id))}) will also be deleted.`:""))) return;
  state.beneficiaries = state.beneficiaries.filter(x=>x.id!==id);
  state.visits = state.visits.filter(v=>v.beneficiaryId!==id);
  state.supports = state.supports.filter(s=>s.beneficiaryId!==id);
  persist(); showView("beneficiaries");
}

/* ============================ Support (funds) ============================ */
function viewSupport(){
  if(fundTab === "received") return viewReceipts();
  const q = filters.q2 || "";
  const from = filters.from || "", to = filters.to || "";
  const list = state.supports
    .filter(s => !q || benName(s.beneficiaryId).toLowerCase().includes(q.toLowerCase()) || (s.notes||"").toLowerCase().includes(q.toLowerCase()))
    .filter(s => !from || (s.date||"") >= from)
    .filter(s => !to || (s.date||"") <= to)
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const total = list.reduce((a,s)=>a+Number(s.amount||0),0);
  const received = state.receipts.reduce((a,r)=>a+Number(r.amount||0),0);
  const given = state.supports.reduce((a,s)=>a+Number(s.amount||0),0);
  const net = received - given;
  return `

  <p class="subtitle">Every gift given from personal funds — and anything received towards the work.</p>
  <div class="row" style="margin-bottom:14px">
    <button class="btn ${fundTab==="given"?"":"secondary"}" onclick="fundTab='given';renderCurrent()">Support given</button>
    <button class="btn ${fundTab==="received"?"":"secondary"}" onclick="fundTab='received';renderCurrent()">Funds received</button>
  </div>
  <div class="toolbar">

    <input type="date" title="To date" value="${esc(to)}" onchange="filters.to=this.value;renderCurrent()">
    ${(q||from||to)?`<button class="btn secondary" onclick="filters.q2='';filters.from='';filters.to='';renderCurrent()">Clear filters</button>`:""}

  </div>
  <div class="card" style="padding:6px 12px">
    ${ list.length ? `<table><thead><tr><th>Date</th><th>Beneficiary</th><th class="hide-sm">Purpose</th><th class="hide-sm">Mode</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>
      ${list.map(s=>`<tr>
        <td style="white-space:nowrap">${fmtDate(s.date)}</td>
        <td><span class="link" onclick="goDetail('${s.beneficiaryId}')">${esc(benName(s.beneficiaryId))}</span></td>
        <td class="hide-sm">${esc(s.purpose||"—")}</td>
        <td class="hide-sm muted">${esc(s.mode||"—")}</td>
        <td style="text-align:right" class="amt">${money(s.amount)}</td>

async function download(filename, text, type){
  // Ask where to save when the browser supports it (Chrome/Edge desktop)
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({ suggestedName: filename });
      const w = await handle.createWritable();
      await w.write(new Blob([text], {type: type||"text/plain"}));
      await w.close();
      return;
    }catch(e){
      if(e && e.name === "AbortError") return; // user cancelled the save dialog
      // any other problem: fall back to a normal download below
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: type||"text/plain"}));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function exportJSON(){
  state.lastBackupAt = new Date().toISOString(); persist();
  download("hands-of-hope-backup-"+todayISO()+".json", JSON.stringify(state,null,2), "application/json");
}

function exportCSV(kind){
  let head, rows;
  if(kind==="beneficiaries"){
    head = ["Name","Category","Status","Gender","Age","Phone","Location","Registered","Total Support","Notes"];
    rows = state.beneficiaries.map(b=>[b.name,b.category,b.status,b.gender,b.age,b.phone,b.location,fmtDate(b.joinedDate),totalFor(b.id),b.notes]);
  }else if(kind==="supports"){
    head = ["Date","Beneficiary","Category","Amount","Purpose","Mode","Notes"];
    rows = state.supports.map(s=>{const b=ben(s.beneficiaryId);return [fmtDate(s.date),benName(s.beneficiaryId),b?b.category:"",s.amount,s.purpose,s.mode,s.notes];});
  }else{
    head = ["Date","Source","Amount","Notes"];
    rows = state.receipts.map(r=>[fmtDate(r.date),r.source,r.amount,r.notes]);
  }
  download(kind+"-"+todayISO()+".csv", "\uFEFF"+[head,...rows].map(r=>r.map(csvCell).join(",")).join("\n"), "text/csv");
}
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.beneficiaries) || !Array.isArray(d.supports)) throw new Error("bad format");
      if(!confirm("Replace all current data with the backup?\n\nBackup contains "+d.beneficiaries.length+" beneficiaries and "+d.supports.length+" support entries.")) return;
      state.beneficiaries = d.beneficiaries; state.supports = d.supports;
      state.categories = (Array.isArray(d.categories) && d.categories.length) ? d.categories : DEFAULT_CATEGORIES.slice();
      if(!Array.isArray(d.receipts)) d.receipts = [];
      state.receipts = d.receipts; state.visits = Array.isArray(d.visits) ? d.visits : []; if(d.org && typeof d.org==="object") state.org = d.org;
      if(typeof d.lastBackupAt === "string") state.lastBackupAt = d.lastBackupAt;
      if(d.ngoName) state.ngoName = d.ngoName;
      if(typeof d.pin === "string") state.pin = d.pin;
      persist(); renderCurrent(); alert("Backup restored.");
    }catch(e){ alert("That file is not a valid backup."); }
  };
  r.readAsText(f); input.value = "";
}

  b1.followUp = new Date(Date.now()+4*86400000).toISOString().slice(0,10);
  state.receipts.push({id:uid("r"),date:todayISO(),amount:2000,source:"Sunday offering",notes:"Sample entry — delete anytime",createdAt:new Date().toISOString()});
  state.beneficiaries.push(b1,b2,b3,b4);

}
function clearAll(){
  if(!confirm("Delete ALL beneficiaries and support entries?\n\nThis cannot be undone.")) return;
  if(!confirm("Are you absolutely sure? Consider downloading a backup first.")) return;
  state.beneficiaries = []; state.supports = []; state.visits = []; persist(); renderCurrent();
}

/* ============================ Modal helpers ============================ */
function openModal(html){
  $("#modalOverlay").innerHTML = '<div class="modal">'+html+'</div>';
  $("#modalOverlay").classList.remove("hidden");
}
function closeModal(){ $("#modalOverlay").classList.add("hidden"); $("#modalOverlay").innerHTML = ""; }
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="Enter" && !$("#pinScreen").classList.contains("hidden") && !$("#pinEntry").classList.contains("hidden")) tryPin();
});

/* ============================ Boot ============================ */
load();
initPin();
