<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
    --shadow-hover: 0 8px 24px rgba(16,24,40,.12);
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px 64px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  header .logo { width: 56px; height: 56px; border-radius: 50%; box-shadow: var(--shadow); }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  header .count { color: var(--muted); font-size: 14px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
  }
  .card .icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .card h2 { font-size: 16px; font-weight: 650; }
  .card p { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; }
  .card .open {
    font-size: 13px; font-weight: 600; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .card .open svg { transition: transform .16s ease; }
  .card:hover .open svg { transform: translateX(3px); }
  .card .placeholder-tag {
    position: absolute; top: 14px; right: 14px;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: #b45309;
    background: #fef3c7; border-radius: 999px; padding: 3px 9px;
  }

  .empty-hint {
    grid-column: 1 / -1;
    text-align: center; color: var(--muted); font-size: 14px;
    padding: 40px 0;
  }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
