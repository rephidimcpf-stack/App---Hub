<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ledger — Small Accounting</title>
<style>
  :root{
    --bg:#f4f5fa; --surface:#fff; --surface-2:#eef0f7;
    --text:#0f172a; --muted:#6b7280; --border:#e4e7ef;
    --primary:#4f46e5; --primary-soft:#eef0ff;
    --income:#10b981; --expense:#ef4444;
    --radius:16px; --shadow:0 2px 10px rgba(15,23,42,.05);
    --menu-shadow:0 12px 32px rgba(15,23,42,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0b0f19; --surface:#151b2b; --surface-2:#1e2637;
    --text:#e8ecf4; --muted:#8b95a8; --border:#252d40;
    --primary:#6366f1; --primary-soft:#1e2440;
    --shadow:0 2px 10px rgba(0,0,0,.35);
    --menu-shadow:0 12px 32px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    transition:background .2s, color .2s;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;font-family:inherit}

  #app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}

  #topbar{padding:14px 18px 10px;padding-top:calc(env(safe-area-inset-top) + 14px);display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:20}
  #topbar h1{font-size:19px;margin:0;font-weight:700}
  #topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}

  /* ---- avatar / menu button ---- */
  #menuWrap{position:relative}
  .avatar{
    width:38px;height:38px;border-radius:12px;
    background:var(--primary-soft);color:var(--primary);
    display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;
    transition:background .18s, transform .12s;
    user-select:none;
  }
  .avatar:hover{background:var(--primary);color:#fff}
  .avatar:active{transform:scale(.94)}
  .avatar.on{background:var(--primary);color:#fff}

  /* ---- dropdown menu ---- */
  .menu{
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    min-width:230px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px;
    box-shadow:var(--menu-shadow);
    opacity:0;
    transform:translateY(-6px) scale(.96);
    transform-origin:top right;
    pointer-events:none;
    transition:opacity .16s ease, transform .16s ease;
    z-index:100;
  }
  .menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}

  .menu-head{
    padding:8px 12px 6px;
    font-size:11px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);
  }
  .menu-item{
    display:flex;align-items:center;gap:12px;
    width:100%;padding:11px 12px;border-radius:10px;
    text-align:left;font-weight:600;font-size:14px;color:var(--text);
    transition:background .12s;
  }
  .menu-item:hover{background:var(--surface-2)}
  .menu-item:active{background:var(--border)}
  .mi-icon{font-size:17px;width:22px;text-align:center;flex:none}
  .mi-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-divider{height:1px;background:var(--border);margin:5px 8px}

  /* ---- sliding switch ---- */
  .mi-switch{
    width:38px;height:22px;border-radius:99px;
    background:var(--border);position:relative;flex:none;
    transition:background .2s ease;
  }
  .mi-switch::after{
    content:"";
    position:absolute;top:2px;left:2px;
    width:18px;height:18px;border-radius:50%;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    transition:transform .2s ease;
  }
  .mi-switch.on{background:var(--primary)}
  .mi-switch.on::after{transform:translateX(16px)}

  #view{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
  #view::-webkit-scrollbar{display:none}

  .card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 4px 10px;font-weight:700}
  .row-between{display:flex;align-items:center;justify-content:space-between}

  .balance{background:linear-gradient(140deg,var(--primary),#7c3aed);color:#fff;border:0;padding:20px;margin-top:8px}
  .balance .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:6px 0 14px;word-break:break-all}
  .balance .split{display:flex;gap:18px;font-size:13px;opacity:.95;flex-wrap:wrap}
  .balance .split div{display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
  .dot.out{opacity:.55}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;text-align:center}
  .stat{background:var(--surface-2);border-radius:12px;padding:10px 6px;overflow:hidden}
  .stat b{display:block;margin-top:4px;font-size:13px;word-break:break-all}
  .in{color:var(--income)} .out{color:var(--expense)}

  .monthbar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px}
  .monthbar button{width:40px;height:36px;border-radius:9px;font-size:20px;color:var(--muted);line-height:1}
  .monthbar button:active{background:var(--surface-2)}
  .monthbar .label{font-weight:600;font-size:14px}

  .tx{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
  .tx:active{background:var(--surface-2)}
  .tx-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;font-weight:800;flex:none}
  .tx-icon.income{background:rgba(16,185,129,.14);color:var(--income)}
  .tx-icon.expense{background:rgba(239,68,68,.14);color:var(--expense)}
  .tx-main{flex:1;min-width:0}
  .tx-cat{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .tx-amt{font-weight:700;font-size:13px;white-space:nowrap}

  .group-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;padding:14px 6px 8px;gap:10px}

  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 12px;margin-bottom:10px}
  .search input{flex:1;border:0;background:none;outline:none;padding:12px 0;font-size:15px;width:100%}
  .filters{display:flex;gap:8px;margin-bottom:6px;overflow-x:auto;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .fchip{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
  .fchip.on{background:var(--primary);border-color:var(--primary);color:#fff}

  .bar-row{margin-bottom:14px}
  .bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:10px}
  .bar-top b{font-weight:700;white-space:nowrap}
  .bar-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:var(--expense)}
  .bar-fill.income{background:var(--income)}

  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty .ico{font-size:34px;opacity:.5;margin-bottom:10px}
  .empty .t{font-weight:600;color:var(--text);margin-bottom:4px;font-size:14px}

  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .set-row:last-child{border-bottom:0}
  .btn{border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;background:var(--surface-2);white-space:nowrap}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.danger{background:rgba(239,68,68,.12);color:var(--expense)}
  .btn:active{transform:scale(.985)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
  .chip.on{background:var(--primary);color:#fff}
  .chip.add{border:1px dashed var(--border);background:transparent;color:var(--primary)}
  .chip .x{opacity:.55;font-size:16px;line-height:1;padding:0 2px}

  .cat-input{display:flex;gap:8px;margin-top:10px}
  .cat-input input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;outline:none;min-width:0}
  .cat-input input:focus{border-color:var(--primary)}

  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
  .tab{color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:8px 0}
  .tab svg{width:22px;height:22px;stroke-width:1.9;fill:none}
  .tab.active{color:var(--primary)}
  .fab{width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;margin:-28px auto 0;font-size:30px;font-weight:300;line-height:1;box-shadow:0 8px 22px rgba(79,70,229,.45);padding:0}
  .fab:active{transform:scale(.94)}

  #backdrop{position:fixed;inset:0;background:rgba(2,6,23,.5);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
  #backdrop.open{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px 18px;padding-bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:94vh;overflow-y:auto;pointer-events:none}
  #sheet.open{transform:translateY(0);pointer-events:auto}
  .handle{width:42px;height:4px;border-radius:99px;background:var(--border);margin:6px auto 16px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin-bottom:18px}
  .seg button{border-radius:10px;padding:11px;font-weight:700;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .seg button.on.inc{color:var(--income)}
  .seg button.on.exp{color:var(--expense)}
  .field{display:block;margin-bottom:16px}
  .field > span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
  .field input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:14px;outline:none;font-size:15px}
  .field input:focus{border-color:var(--primary)}
  #f-amount{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.5px;padding:16px}
  .sheet-actions{display:flex;gap:10px;margin-top:6px}
  .sheet-actions .btn{flex:1;padding:15px}

  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,14px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:86vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div>
      <h1 id="title">Ledger</h1>
      <div class="sub" id="subtitle">Small business accounting</div>
    </div>

    <div id="menuWrap">
      <button class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false" aria-label="Open menu">≡</button>
      <div class="menu" id="menu" role="menu">
        <div class="menu-head">Appearance</div>
        <button class="menu-item" id="themeItem" role="menuitem" onclick="app.toggleTheme()">
          <span class="mi-icon" id="themeIcon">☀️</span>
          <span class="mi-label" id="themeLabel">Light mode</span>
          <span class="mi-switch" id="themeSwitch"></span>
        </button>

        <div class="menu-divider"></div>
        <div class="menu-head">Data</div>
        <button class="menu-item" role="menuitem" onclick="app.exportJSON()">
          <span class="mi-icon">💾</span>
          <span class="mi-label">Quick backup</span>
        </button>
        <button class="menu-item" role="menuitem" onclick="app.importJSON()">
          <span class="mi-icon">📂</span>
          <span class="mi-label">Restore backup</span>
        </button>

        <div class="menu-divider"></div>
        <button class="menu-item" role="menuitem" onclick="app.setTab('settings'); app.closeMenu();">
          <span class="mi-icon">⚙️</span>
          <span class="mi-label">All settings</span>
        </button>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <button class="tab" data-tab="home" onclick="app.setTab('home')">
      <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </button>
    <button class="tab" data-tab="tx" onclick="app.setTab('tx')">
      <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Entries
    </button>
    <button class="fab" onclick="app.openAdd()" aria-label="Add entry">+</button>
    <button class="tab" data-tab="reports" onclick="app.setTab('reports')">
      <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M5 20v-8M12 20V4M19 20v-6"/></svg>
      Reports
    </button>
    <button class="tab" data-tab="settings" onclick="app.setTab('settings')">
      <svg viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.18V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 7.3 19.4l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3 13.7H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 7.3l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 2.82 1.18l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </nav>
</div>

<div id="backdrop" onclick="app.closeSheet()"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
(function(){
  'use strict';

  var KEY = 'mini-ledger-v2';
  var THEME_KEY = 'ledger-theme';

  /* No default categories — user builds them as they go */
  var DEFAULT_STATE = {
    categories: {
      expense: [],
      income:  []
    },
    tx: []
  };

  var state    = loadState();
  var tab      = 'home';
  var filter   = 'all';
  var query    = '';
  var monthKey = curMonth();
  var draft    = null;
  var toastTimer = null;
  var menuOpen = false;

  /* ---------------- helpers ---------------- */
  function $(s){ return document.querySelector(s); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function jsArg(v){
    return JSON.stringify(String(v))
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function sum(arr){
    var t = 0;
    for (var i=0;i<arr.length;i++) t += Number(arr[i].amount) || 0;
    return t;
  }
  function isoOf(d){
    return d.getFullYear() + '-' +
           String(d.getMonth()+1).padStart(2,'0') + '-' +
           String(d.getDate()).padStart(2,'0');
  }
  function todayISO(){ return isoOf(new Date()); }
  function curMonth(){ return todayISO().slice(0,7); }

  function parseISO(s){
    var p = String(s).split('-');
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function monthLabel(key){
    var p = key.split('-');
    return new Date(+p[0], +p[1]-1, 1)
      .toLocaleDateString(undefined, {month:'long', year:'numeric'});
  }
  function shiftMonth(key, delta){
    var p = key.split('-');
    var d = new Date(+p[0], +p[1]-1+delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function dateLabel(iso){
    if (iso === todayISO()) return 'Today';
    var y = new Date(); y.setDate(y.getDate()-1);
    if (iso === isoOf(y)) return 'Yesterday';
    var d = parseISO(iso);
    var sameYear = d.getFullYear() === new Date().getFullYear();
    var opts = {weekday:'short', day:'numeric', month:'short'};
    if (!sameYear) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }

  /* 3 decimals, no currency prefix */
  function fmt(n){
    var num = Number(n) || 0;
    var neg = num < 0;
    var v = Math.abs(num).toLocaleString(undefined,
      {minimumFractionDigits:3, maximumFractionDigits:3});
    return (neg ? '-' : '') + v;
  }

  /* ---------------- persistence ---------------- */
  function loadState(){
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw){
        var old = localStorage.getItem('mini-ledger-v1');
        if (old){
          try {
            var od = JSON.parse(old);
            var mig = { categories: { expense: [], income: [] }, tx: [] };
            if (od.categories){
              if (Array.isArray(od.categories.expense)) mig.categories.expense = od.categories.expense.slice();
              if (Array.isArray(od.categories.income))  mig.categories.income  = od.categories.income.slice();
            }
            if (Array.isArray(od.tx)){
              for (var m=0;m<od.tx.length;m++){
                var ot = od.tx[m];
                if (!ot || typeof ot.date !== 'string') continue;
                mig.tx.push({
                  id: ot.id || uid(),
                  type: ot.type === 'income' ? 'income' : 'expense',
                  amount: Number(ot.amount) || 0,
                  category: String(ot.category || 'Uncategorized'),
                  date: ot.date,
                  note: typeof ot.note === 'string' ? ot.note : '',
                  createdAt: ot.createdAt || Date.now()
                });
              }
            }
            return mig;
          } catch (e2){}
        }
        return clone(DEFAULT_STATE);
      }
      var d = JSON.parse(raw);
      var out = { categories: { expense: [], income: [] }, tx: [] };
      if (d.categories){
        if (Array.isArray(d.categories.expense)) out.categories.expense = d.categories.expense.slice();
        if (Array.isArray(d.categories.income))  out.categories.income  = d.categories.income.slice();
      }
      if (Array.isArray(d.tx)){
        for (var i=0;i<d.tx.length;i++){
          var t = d.tx[i];
          if (!t || typeof t.date !== 'string') continue;
          out.tx.push({
            id: t.id || uid(),
            type: t.type === 'income' ? 'income' : 'expense',
            amount: Number(t.amount) || 0,
            category: String(t.category || 'Uncategorized'),
            date: t.date,
            note: typeof t.note === 'string' ? t.note : '',
            createdAt: t.createdAt || Date.now()
          });
        }
      }
      return out;
    } catch (e) {
      return clone(DEFAULT_STATE);
    }
  }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e){ toast('Storage unavailable'); }
  }

  /* ---------------- theme ---------------- */
  function getPreferredTheme(){
    var stored = null;
    try { stored = localStorage.getItem(THEME_KEY); } catch (e){}
    if (stored === 'dark' || stored === 'light') return stored;
    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        return 'dark';
      }
    } catch (e){}
    return 'light';
  }

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e){}

    var sw    = document.getElementById('themeSwitch');
    var icon  = document.getElementById('themeIcon');
    var label = document.getElementById('themeLabel');

    if (sw)    sw.classList.toggle('on', t === 'dark');
    if (icon)  icon.textContent  = t === 'dark' ? '🌙' : '☀️';
    if (label) label.textContent = t === 'dark' ? 'Dark mode' : 'Light mode';

    // Update browser UI color to match
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#151b2b' : '#4f46e5');
  }

  function toggleTheme(){
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  /* ---------------- menu ---------------- */
  function openMenu(){
    if (menuOpen) return;
    menuOpen = true;
    var m = $('#menu');
    var a = $('#avatar');
    if (m) m.classList.add('open');
    if (a){
      a.classList.add('on');
      a.setAttribute('aria-expanded', 'true');
    }
  }
  function closeMenu(){
    if (!menuOpen) return;
    menuOpen = false;
    var m = $('#menu');
    var a = $('#avatar');
    if (m) m.classList.remove('open');
    if (a){
      a.classList.remove('on');
      a.setAttribute('aria-expanded', 'false');
    }
  }
  function toggleMenu(e){
    if (e) e.stopPropagation();
    if (menuOpen) closeMenu(); else openMenu();
  }

  /* ---------------- toast ---------------- */
  function toast(msg){
    var el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  /* ---------------- sorting ---------------- */
  function sorted(list){
    return list.slice().sort(function(a,b){
      var dc = String(b.date).localeCompare(String(a.date));
      if (dc) return dc;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  /* =========================================================
     RENDER
     ========================================================= */
  function render(){
    var titles = {
      home:     ['Ledger',   'Small business accounting'],
      tx:       ['Entries',  'All your transactions'],
      reports:  ['Reports',  'Where the money goes'],
      settings: ['Settings', 'Preferences & data']
    };
    var t = titles[tab] || titles.home;

    $('#subtitle').textContent = t[1];

    var view = $('#view');
    if (tab === 'home')          view.innerHTML = viewHome();
    else if (tab === 'tx')       view.innerHTML = viewTx();
    else if (tab === 'reports')  view.innerHTML = viewReports();
    else                         view.innerHTML = viewSettings();
    view.scrollTop = 0;

    var tabs = document.querySelectorAll('#tabbar .tab');
    for (var i=0;i<tabs.length;i++){
      var active = tabs[i].getAttribute('data-tab') === tab;
      if (active) tabs[i].classList.add('active');
      else        tabs[i].classList.remove('active');
    }

    if (tab === 'tx'){
      var si = $('#searchInput');
      if (si){
        si.addEventListener('input', function(e){
          query = e.target.value;
          var list = $('#txList');
          if (list) list.innerHTML = txListHTML();
        });
      }
    }
  }

  /* ---------------- HOME ---------------- */

    var html = '';

    html +=   '<div class="small" style="opacity:.85;font-weight:600;letter-spacing:.4px">TOTAL BALANCE</div>';
    html +=   '<div class="big">' + fmt(bal) + '</div>';
    html +=   '<div class="split">';
    html +=     '<div><span class="dot"></span> Income ' + fmt(inc) + '</div>';
    html +=     '<div><span class="dot out"></span> Expenses ' + fmt(exp) + '</div>';
    html +=   '</div>';
    html += '</section>';

    html += '<section class="card" style="margin-top:14px">';
    html +=   '<div class="row-between"><b style="font-size:14px">' + monthLabel(curMonth()) + '</b>';
    html +=   '<span class="small muted">' + m.length + ' entries</span></div>';
    html +=   '<div class="stat-row">';
    html +=     '<div class="stat"><span class="small muted">Income</span><b class="in">' + fmt(mInc) + '</b></div>';
    html +=     '<div class="stat"><span class="small muted">Expenses</span><b class="out">' + fmt(mExp) + '</b></div>';

  /* ---------------- TRANSACTIONS ---------------- */
  function viewTx(){
    var html = '';
    html += '<div class="monthbar">';
    html +=   '<button onclick="app.shiftMonth(-1)">‹</button>';
    html +=   '<div class="label">' + monthLabel(monthKey) + '</div>';
    html +=   '<button onclick="app.shiftMonth(1)">›</button>';

    html += '<div class="search">';

    html += '</div>';

  function txListHTML(){
    var list = state.tx.filter(function(t){ return t.date.indexOf(monthKey) === 0; });
    if (filter !== 'all') list = list.filter(function(t){ return t.type === filter; });
    var q = query.trim().toLowerCase();
    if (q){
      list = list.filter(function(t){
        return (t.category || '').toLowerCase().indexOf(q) !== -1 ||
               (t.note || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    list = sorted(list);

    if (!list.length)
      return emptyState('🔍', 'Nothing here', 'No entries match this month or filter.');

    var groups = {};
    for (var i=0;i<list.length;i++){
      var t = list[i];
      if (!groups[t.date]) groups[t.date] = [];
      groups[t.date].push(t);
    }
    var dates = Object.keys(groups).sort().reverse();

    var html = '';
    for (var d=0; d<dates.length; d++){
      var date = dates[d];
      var items = groups[date];
      var net = 0;
      for (var j=0;j<items.length;j++){
        net += (items[j].type === 'income' ? 1 : -1) * Number(items[j].amount);
      }
      html += '<div class="group-head"><span>' + dateLabel(date) + '</span><span>' + fmt(net) + '</span></div>';
      for (var k=0;k<items.length;k++) html += txRow(items[k]);
    }
    return html;
  }

  function txRow(t){
    var sign  = t.type === 'income' ? '+' : '−';
    var cls   = t.type === 'income' ? 'income' : 'expense';
    var arrow = t.type === 'income' ? '↑' : '↓';
    return '<button class="tx" onclick="app.editTx(' + jsArg(t.id) + ')">' +
             '<div class="tx-icon ' + cls + '">' + arrow + '</div>' +
             '<div class="tx-main">' +
               '<div class="tx-cat">' + esc(t.category) + '</div>' +
               '<div class="tx-sub">' + dateLabel(t.date) + (t.note ? ' · ' + esc(t.note) : '') + '</div>' +
             '</div>' +
             '<div class="tx-amt ' + cls + '">' + sign + fmt(t.amount) + '</div>' +
           '</button>';
  }

  /* ---------------- REPORTS ---------------- */
  function viewReports(){
    var list = state.tx.filter(function(t){ return t.date.indexOf(monthKey) === 0; });
    var inc  = sum(list.filter(function(t){ return t.type === 'income'; }));
    var exp  = sum(list.filter(function(t){ return t.type === 'expense'; }));

    var expCats = breakdown('expense', list);
    var incCats = breakdown('income', list);
    var maxExp = 1, maxInc = 1;
    for (var i=0;i<expCats.length;i++) if (expCats[i][1] > maxExp) maxExp = expCats[i][1];
    for (var j=0;j<incCats.length;j++) if (incCats[j][1] > maxInc) maxInc = incCats[j][1];

    var html = '';
    html += '<div class="monthbar">';
    html +=   '<button onclick="app.shiftMonth(-1)">‹</button>';
    html +=   '<div class="label">' + monthLabel(monthKey) + '</div>';
    html +=   '<button onclick="app.shiftMonth(1)">›</button>';
    html += '</div>';

    html += '<section class="card"><div class="stat-row" style="margin-top:0">';
    html +=   '<div class="stat"><span class="small muted">Income</span><b class="in">' + fmt(inc) + '</b></div>';
    html +=   '<div class="stat"><span class="small muted">Expenses</span><b class="out">' + fmt(exp) + '</b></div>';
    html +=   '<div class="stat"><span class="small muted">Net</span><b>' + fmt(inc - exp) + '</b></div>';
    html += '</div></section>';

    html += '<h3 class="sec-title">Expenses by category</h3><section class="card">';
    if (expCats.length){
      for (var a=0;a<expCats.length;a++) html += bar(expCats[a][0], expCats[a][1], maxExp, '');
    } else {
      html += '<div class="muted small" style="padding:8px 0">No expenses recorded this month.</div>';
    }
    html += '</section>';

    html += '<h3 class="sec-title">Income by category</h3><section class="card">';
    if (incCats.length){
      for (var b=0;b<incCats.length;b++) html += bar(incCats[b][0], incCats[b][1], maxInc, 'income');
    } else {
      html += '<div class="muted small" style="padding:8px 0">No income recorded this month.</div>';
    }
    html += '</section>';
    return html;
  }

  function breakdown(type, list){
    var map = {};
    for (var i=0;i<list.length;i++){
      var t = list[i];
      if (t.type !== type) continue;
      map[t.category] = (map[t.category] || 0) + Number(t.amount);
    }
    var arr = [];
    for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) arr.push([k, map[k]]);
    arr.sort(function(a,b){ return b[1] - a[1]; });
    return arr;
  }

  function bar(label, amount, max, cls){
    var pct = Math.max(3, Math.round(amount / max * 100));
    return '<div class="bar-row">' +
             '<div class="bar-top"><span>' + esc(label) + '</span><b>' + fmt(amount) + '</b></div>' +
             '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
           '</div>';
  }

  /* =========================================================
     SHEET (ADD / EDIT)
     ========================================================= */
  function openSheet(id){
    if (id){
      var found = null;
      for (var i=0;i<state.tx.length;i++){
        if (state.tx[i].id === id){ found = state.tx[i]; break; }
      }
      if (!found) { toast('Entry not found'); return; }
      draft = {
        id: found.id,
        type: found.type,
        amount: String(found.amount),
        category: found.category,
        date: found.date,
        note: found.note || '',
        newCatOpen: false,
        newCatName: ''
      };
    } else {
      var cats = state.categories.expense || [];
      draft = {
        id: null,
        type: 'expense',
        amount: '',
        category: cats.length ? cats[0] : '',
        date: todayISO(),
        note: '',
        newCatOpen: false,
        newCatName: ''
      };
    }
    renderSheet();
    $('#backdrop').classList.add('open');
    $('#sheet').classList.add('open');
  }

  function closeSheet(){
    $('#backdrop').classList.remove('open');
    $('#sheet').classList.remove('open');
    draft = null;
  }

  function renderSheet(){
    if (!draft) return;
    var cats = state.categories[draft.type] || [];
    if (cats.length && cats.indexOf(draft.category) === -1) draft.category = cats[0];
    if (!cats.length) draft.category = '';

    var html = '<div class="handle"></div>';
    html += '<div class="seg">';
    html +=   '<button class="' + (draft.type === 'expense' ? 'on exp' : '') + '" onclick="app.setType(\'expense\')">Expense</button>';
    html +=   '<button class="' + (draft.type === 'income'  ? 'on inc' : '') + '" onclick="app.setType(\'income\')">Income</button>';
    html += '</div>';

    html += '<label class="field"><span>Amount</span>';
    html +=   '<input id="f-amount" type="text" inputmode="decimal" placeholder="0.000" value="' + esc(draft.amount) + '" autocomplete="off">';
    html += '</label>';

    html += '<div class="field"><span>Category</span>';

    if (cats.length){
      html += '<div class="chips">';
      for (var i=0;i<cats.length;i++){
        var c = cats[i];
        html += '<button class="chip ' + (draft.category === c && !draft.newCatOpen ? 'on' : '') + '" ' +
                'onclick="app.pickCat(' + jsArg(c) + ')">' + esc(c) + '</button>';
      }
      if (!draft.newCatOpen){
        html += '<button class="chip add" onclick="app.openNewCat()">+ New</button>';
      }
      html += '</div>';
    }

    if (draft.newCatOpen || !cats.length){
      html += '<div class="cat-input" style="margin-top:' + (cats.length ? '10px' : '0') + '">';
      html +=   '<input id="newCatInline" type="text" autocomplete="off" placeholder="' +
                (cats.length ? 'New category name' : 'Add your first category') + '" value="' + esc(draft.newCatName) + '">';
      html +=   '<button class="btn primary" onclick="app.confirmNewCat()">Add</button>';
      if (cats.length){
        html += '<button class="btn" onclick="app.cancelNewCat()" aria-label="Cancel">×</button>';
      }
      html += '</div>';
    }

    html += '</div>';

    html += '<label class="field"><span>Date</span>';
    html +=   '<input id="f-date" type="date" value="' + esc(draft.date) + '">';
    html += '</label>';

    html += '<label class="field"><span>Note</span>';
    html +=   '<input id="f-note" type="text" placeholder="Optional" value="' + esc(draft.note) + '">';
    html += '</label>';

    html += '<div class="sheet-actions">';
    if (draft.id) html += '<button class="btn danger" onclick="app.deleteTx()">Delete</button>';
    html +=   '<button class="btn primary" onclick="app.saveTx()">' +
              (draft.id ? 'Save changes' : 'Add entry') + '</button>';
    html += '</div>';

    $('#sheet').innerHTML = html;

    var amtEl = $('#f-amount');
    if (amtEl) amtEl.addEventListener('input', function(e){ draft.amount = e.target.value; });

    var dateEl = $('#f-date');
    if (dateEl) dateEl.addEventListener('change', function(e){ draft.date = e.target.value || todayISO(); });

    var noteEl = $('#f-note');
    if (noteEl) noteEl.addEventListener('input', function(e){ draft.note = e.target.value; });

    var newCatEl = $('#newCatInline');
    if (newCatEl){
      newCatEl.addEventListener('input', function(e){ draft.newCatName = e.target.value; });
      newCatEl.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); window.app.confirmNewCat(); }
      });
      if (!cats.length) setTimeout(function(){ newCatEl.focus(); }, 320);
      else if (draft.newCatOpen) setTimeout(function(){ newCatEl.focus(); }, 60);
    }
  }

  /* =========================================================
     ACTIONS
     ========================================================= */
  function saveTx(){
    if (!draft) return;
    var cleaned = String(draft.amount).replace(',', '.').replace(/[^0-9.\-]/g, '');
    var amount = parseFloat(cleaned);
    if (!amount || amount <= 0 || isNaN(amount)) { toast('Enter a valid amount'); return; }

    var inlineEl = $('#newCatInline');
    var inlineName = inlineEl ? inlineEl.value.trim() : '';
    var category = draft.category;

    if (inlineName){
      var list = state.categories[draft.type];
      var existing = null;
      for (var i=0;i<list.length;i++){
        if (list[i].toLowerCase() === inlineName.toLowerCase()){ existing = list[i]; break; }
      }
      if (existing){
        category = existing;
      } else {
        list.push(inlineName);
        category = inlineName;
      }
    }

    if (!category){ toast('Add or pick a category'); return; }

    var isEdit = !!draft.id;
    if (isEdit){
      var found = false;
      for (var j=0;j<state.tx.length;j++){
        if (state.tx[j].id === draft.id){
          state.tx[j].type     = draft.type;
          state.tx[j].amount   = amount;
          state.tx[j].category = category;
          state.tx[j].date     = draft.date;
          state.tx[j].note     = draft.note.trim();
          found = true;
          break;
        }
      }
      if (!found) toast('Entry not found');
    } else {
      state.tx.push({
        id: uid(),
        type: draft.type,
        amount: amount,
        category: category,
        date: draft.date,
        note: draft.note.trim(),
        createdAt: Date.now()
      });
    }
    save();
    closeSheet();
    render();
    toast(isEdit ? 'Entry updated' : 'Entry added');
  }

  function deleteTx(){
    if (!draft || !draft.id) return;
    if (!confirm('Delete this entry?')) return;
    var id = draft.id;
    state.tx = state.tx.filter(function(t){ return t.id !== id; });
    save();
    closeSheet();
    render();
    toast('Entry deleted');
  }

  function addCat(type){
    var input = $(type === 'expense' ? '#newExpense' : '#newIncome');
    if (!input) return;
    var name = input.value.trim();
    if (!name) { toast('Type a category name'); return; }
    var exists = false;
    for (var i=0;i<state.categories[type].length;i++){
      if (state.categories[type][i].toLowerCase() === name.toLowerCase()){ exists = true; break; }
    }
    if (exists) { toast('Category already exists'); input.value = ''; return; }
    state.categories[type].push(name);
    save();
    render();
    toast('Category added');
  }

  function delCat(type, cat){
    if (!confirm('Remove "' + cat + '" category?\nExisting entries will keep it.')) return;
    state.categories[type] = state.categories[type].filter(function(c){ return c !== cat; });
    if (draft && draft.type === type && draft.category === cat){
      var list = state.categories[type];
      draft.category = list.length ? list[0] : '';
    }
    save();
    render();
    if (draft) renderSheet();
  }

  /* =========================================================
     SAVE FILE WITH LOCATION PICKER
     ========================================================= */
  function saveFileWithLocation(name, content, mime, description, extension){
    if (typeof window.showSaveFilePicker === 'function'){
      var pickerOpts = {
        suggestedName: name,
        types: [{
          description: description,
          accept: (function(){
            var o = {};
            o[mime] = [extension];
            return o;
          })()
        }]
      };
      return window.showSaveFilePicker(pickerOpts).then(function(handle){
        return handle.createWritable().then(function(writable){
          return writable.write(content).then(function(){
            return writable.close();
          });
        });
      }).then(function(){
        return { ok: true, location: 'picker' };
      }).catch(function(err){
        if (err && err.name === 'AbortError'){
          return { ok: false, reason: 'cancelled' };
        }
        console.warn('Save picker error:', err);
        return { ok: false, reason: 'error' };
      });
    }

    try {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        try { document.body.removeChild(a); } catch(e){}
        URL.revokeObjectURL(url);
      }, 1500);
      return Promise.resolve({ ok: true, location: 'download' });
    } catch (e){
      return Promise.resolve({ ok: false, reason: 'error' });
    }
  }

  function exportJSON(){
    var payload = {
      version: 2,
      app: 'mini-ledger',
      exportedAt: new Date().toISOString(),
      categories: state.categories,
      tx: state.tx
    };
    var name = 'ledger-backup-' + todayISO() + '.json';
    var json = JSON.stringify(payload, null, 2);

    saveFileWithLocation(name, json, 'application/json', 'JSON backup', '.json')
      .then(function(res){
        if (res.ok)              toast('Backup saved ✓');
        else if (res.reason === 'cancelled') toast('Save cancelled');
        else                     toast('Could not save backup');
      });
  }

  function exportCSV(){
    if (!state.tx.length) { toast('Nothing to export'); return; }
    var rows = [['Date','Type','Category','Amount','Note']];
    var list = sorted(state.tx).reverse();
    for (var i=0;i<list.length;i++){
      var t = list[i];
      rows.push([t.date, t.type, t.category, t.amount, t.note || '']);
    }
    var csv = rows.map(function(r){
      return r.map(function(c){
        return '"' + String(c).replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\r\n');
    var name = 'ledger-' + todayISO() + '.csv';

    saveFileWithLocation(name, csv, 'text/csv', 'CSV file', '.csv')
      .then(function(res){
        if (res.ok)              toast('CSV exported ✓');
        else if (res.reason === 'cancelled') toast('Export cancelled');
        else                     toast('Could not export CSV');
      });
  }

  function importJSON(){
    var fileInput = $('#importFile');
    if (fileInput) fileInput.click();
    else toast('Restore not available');
  }

  function handleFile(file){
    if (!file) return;
    if (file.size > 10 * 1024 * 1024){ toast('File too large'); return; }
    var reader = new FileReader();

    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); }
      catch (e){ toast('Invalid JSON file'); return; }

      if (!data || !Array.isArray(data.tx)){ toast('Not a valid backup file'); return; }

      var newState = { categories: { expense: [], income: [] }, tx: [] };
      if (data.categories){
        if (Array.isArray(data.categories.expense)) newState.categories.expense = data.categories.expense.slice();
        if (Array.isArray(data.categories.income))  newState.categories.income  = data.categories.income.slice();
      }

      for (var i=0;i<data.tx.length;i++){
        var t = data.tx[i];
        if (!t || typeof t.date !== 'string') continue;
        newState.tx.push({
          id: t.id || uid(),
          type: t.type === 'income' ? 'income' : 'expense',
          amount: Number(t.amount) || 0,
          category: String(t.category || 'Uncategorized'),
          date: t.date,
          note: typeof t.note === 'string' ? t.note : '',
          createdAt: t.createdAt || Date.now()
        });
      }

      if (!newState.tx.length && !newState.categories.expense.length && !newState.categories.income.length){
        toast('Backup is empty'); return;
      }

      var msg = 'Restore ' + newState.tx.length + ' entries from backup?\n\n' +
                'This will REPLACE all current data.';
      if (!confirm(msg)) return;

      state = newState;
      save();
      tab = 'home';
      render();
      toast('Restored ' + newState.tx.length + ' entries');
    };

    reader.onerror = function(){ toast('Could not read file'); };
    reader.readAsText(file);
  }

  function clearAll(){
    if (!confirm('Erase ALL transactions and settings? This cannot be undone.')) return;
    if (!confirm('Are you absolutely sure? Consider creating a backup first.')) return;
    try {
      localStorage.removeItem(KEY);
      localStorage.removeItem('mini-ledger-v1');
    } catch (e){}
    state = clone(DEFAULT_STATE);
    save();
    render();
    toast('All data erased');
  }

  /* =========================================================
     PUBLIC API
     ========================================================= */
  window.app = {
    setTab: function(t){ tab = t; query = ''; filter = 'all'; closeMenu(); render(); },
    shiftMonth: function(d){ monthKey = shiftMonth(monthKey, d); render(); },
    setFilter: function(f){ filter = f; render(); },
    openAdd: function(){ closeMenu(); openSheet(null); },
    editTx:  function(id){ openSheet(id); },
    closeSheet: closeSheet,

    toggleMenu: toggleMenu,
    closeMenu: closeMenu,
    toggleTheme: toggleTheme,

    setType: function(t){
      if (!draft) return;
      draft.type = t;
      var list = state.categories[t] || [];
      draft.category = list.length ? list[0] : '';
      draft.newCatOpen = false;
      draft.newCatName = '';
      renderSheet();
    },
    pickCat: function(c){
      if (!draft) return;
      draft.category = c;
      draft.newCatOpen = false;
      draft.newCatName = '';
      renderSheet();
    },
    openNewCat: function(){
      if (!draft) return;
      draft.newCatOpen = true;
      draft.newCatName = '';
      renderSheet();
    },
    cancelNewCat: function(){
      if (!draft) return;
      draft.newCatOpen = false;
      draft.newCatName = '';
      renderSheet();
    },
    confirmNewCat: function(){
      if (!draft) return;
      var input = $('#newCatInline');
      var name = input ? input.value.trim() : (draft.newCatName || '').trim();
      if (!name){ toast('Type a category name'); return; }
      var list = state.categories[draft.type];
      var existing = null;
      for (var i=0;i<list.length;i++){
        if (list[i].toLowerCase() === name.toLowerCase()){ existing = list[i]; break; }
      }
      if (existing){
        draft.category = existing;
        toast('Category already exists');
      } else {
        list.push(name);
        draft.category = name;
        save();
        toast('Category added');
      }
      draft.newCatOpen = false;
      draft.newCatName = '';
      renderSheet();
    },
    saveTx:   saveTx,
    deleteTx: deleteTx,
    addCat:   addCat,
    delCat:   delCat,
    exportJSON: exportJSON,
    exportCSV:  exportCSV,
    importJSON: importJSON,
    clearAll:   clearAll
  };

  /* =========================================================
     BOOT / GLOBAL LISTENERS
     ========================================================= */
  var importInput = $('#importFile');
  if (importInput){
    importInput.addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0];
      if (f) handleFile(f);
      e.target.value = '';
    });
  }

  /* Avatar opens / closes the menu */
  var avatarEl = $('#avatar');
  if (avatarEl){
    avatarEl.addEventListener('click', function(e){
      e.stopPropagation();
      toggleMenu(e);
    });
  }

  /* Click anywhere else closes the menu */
  document.addEventListener('click', function(e){
    if (!menuOpen) return;
    var wrap = $('#menuWrap');
    if (wrap && !wrap.contains(e.target)) closeMenu();
  });

  /* Touch: same behavior */
  document.addEventListener('touchstart', function(e){
    if (!menuOpen) return;
    var wrap = $('#menuWrap');
    if (wrap && !wrap.contains(e.target)) closeMenu();
  }, { passive: true });

  /* Escape closes menu and sheet */
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      if (menuOpen) closeMenu();
      else if (draft) closeSheet();
    }
  });

  /* Follow system theme changes if user hasn't picked a preference */
  try {
    if (window.matchMedia){
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var sysListener = function(){
        var stored = null;
        try { stored = localStorage.getItem(THEME_KEY); } catch (e){}
        if (!stored) applyTheme(mq.matches ? 'dark' : 'light');
      };
      if (mq.addEventListener)      mq.addEventListener('change', sysListener);
      else if (mq.addListener)      mq.addListener(sysListener);
    }
  } catch (e){}

  /* Init */
  applyTheme(getPreferredTheme());
  render();

})();
</script>
</body>
</html>
