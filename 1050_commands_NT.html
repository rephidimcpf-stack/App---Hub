<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1,050 New Testament Commands</title>
<style>
:root{
  --bg:#f6f2e9; --panel:#ffffff; --panel-2:#fdfbf6;
  --ink:#1f1c17; --ink-2:#575045; --ink-3:#938c7f;
  --line:#e8e1d2; --line-2:#efe9dc;
  --gold:#9b7a38; --gold-2:#c9a352; --gold-soft:#f5ecd6;
  --mark:#fde9a8; --green:#3f7d54; --green-soft:#e5f0e7;
  --red:#a8452f;
  --shadow-sm:0 1px 2px rgba(60,48,20,.04);
  --shadow:0 1px 2px rgba(60,48,20,.05),0 12px 32px -16px rgba(60,48,20,.22);
  --shadow-lg:0 20px 60px -20px rgba(40,30,10,.35);
  --radius:14px;
  --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --sidebar-w:300px;
}
[data-theme="dark"]{
  --bg:#0d0f13; --panel:#161a22; --panel-2:#1a1f28;
  --ink:#ece9e1; --ink-2:#a29c90; --ink-3:#6a655b;
  --line:#232833; --line-2:#1c212a;
  --gold:#d8b26a; --gold-2:#e8c98a; --gold-soft:#2a2416;
  --mark:#5c4a1a; --green:#78c193; --green-soft:#16251c;
  --red:#e0836a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.6);
  --shadow-lg:0 20px 60px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s; min-height:100vh;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:var(--mark);color:var(--ink)}
mark{background:var(--mark);color:inherit;padding:1px 3px;border-radius:3px;font-weight:600}

.read-progress{
  position:fixed;top:0;left:0;height:2px;width:0;z-index:100;
  background:linear-gradient(90deg,var(--gold),var(--gold-2));
  transition:width .1s linear;pointer-events:none;
}

/* === Topbar === */
.topbar{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;gap:16px;padding:12px 22px;max-width:1740px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(145deg,var(--gold-2),var(--gold));
  display:grid;place-items:center;color:#fff;font-weight:800;
  font-family:var(--serif);font-size:18px;letter-spacing:-.5px;
  box-shadow:0 4px 12px -4px rgba(155,122,56,.55),inset 0 1px 0 rgba(255,255,255,.3);
}
.brand-text h1{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
.brand-text p{font-size:11px;color:var(--ink-3);letter-spacing:.2px;margin-top:2px}
.search-wrap{flex:1;position:relative;max-width:560px;margin:0 auto}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search-wrap:focus-within svg{color:var(--gold)}
#search{
  width:100%;padding:11px 44px 11px 42px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);font-size:14px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
#search:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
#search::placeholder{color:var(--ink-3)}
.kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:10.5px;font-weight:600;color:var(--ink-3);
  background:var(--line-2);padding:3px 6px;border-radius:5px;
  border:1px solid var(--line);pointer-events:none;transition:opacity .2s;
}
#search:focus+.kbd,#search:not(:placeholder-shown)+.kbd{opacity:0}
.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.icon-btn{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-2);border:1px solid transparent;transition:.15s;
}
.icon-btn:hover{background:var(--panel);border-color:var(--line);color:var(--ink);transform:translateY(-1px)}
.menu-btn{display:none}

/* === Layout === */
.layout{display:flex;max-width:1740px;margin:0 auto;align-items:flex-start}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  position:sticky;top:65px;height:calc(100vh - 65px);
  overflow-y:auto;overscroll-behavior:contain;
  padding:22px 14px 80px;border-right:1px solid var(--line);
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;border:2px solid var(--bg)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow-sm)}
.stat-num{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1;font-family:var(--serif)}
.stat-num.gold{color:var(--gold)}
.stat-num.green{color:var(--green)}
.stat-lbl{font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);margin-top:5px}

.offline-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
.offline-card .oc-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.offline-card .oc-head svg{color:var(--green);flex-shrink:0}
.offline-card .oc-title{font-size:12.5px;font-weight:700}
.offline-card .oc-sub{font-size:11px;color:var(--ink-3);margin-bottom:11px;line-height:1.5}
.offline-progress{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-bottom:9px}
.offline-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green),#5da977);transition:width .4s}
.offline-status{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-bottom:10px;font-variant-numeric:tabular-nums}
.offline-btn{
  width:100%;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:650;
  border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.offline-btn:hover{border-color:var(--green);color:var(--green)}
.offline-btn:disabled{opacity:.55;cursor:not-allowed}
.offline-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.offline-btn.primary:hover{filter:brightness(1.08);color:#fff}

.side-label{
  font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--ink-3);padding:16px 10px 8px;
}
.cat-btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 11px;border-radius:10px;font-size:13.5px;color:var(--ink-2);
  transition:background .13s,color .13s;line-height:1.35;
}
.cat-btn:hover{background:var(--line-2);color:var(--ink)}
.cat-btn.active{background:var(--gold-soft);color:var(--gold);font-weight:650}
[data-theme="dark"] .cat-btn.active{color:var(--gold-2)}
.cat-btn .ico{font-size:14px;flex-shrink:0;width:20px;text-align:center}
.cat-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-btn .cnt{
  font-size:10.5px;font-weight:600;color:var(--ink-3);
  background:var(--line-2);padding:2px 7px;border-radius:99px;flex-shrink:0;
  font-variant-numeric:tabular-nums;
}
.cat-btn.active .cnt{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}

.content{flex:1;min-width:0;padding:30px 36px 140px}
.page-head{margin-bottom:26px;max-width:900px}
.page-head .eyebrow{
  font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.page-head .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);max-width:80px}
.page-head h2{
  font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.6px;
  line-height:1.15;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.page-head h2 .ico{font-size:28px}
.page-head .sub{margin-top:12px;color:var(--ink-2);font-size:15px;line-height:1.65;max-width:740px}
.page-head .meta{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{
  font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;
}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
[data-theme="dark"] .chip.gold{color:var(--gold-2)}
.chip.green{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.solid{background:var(--gold);border-color:var(--gold);color:#fff}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 26px}
.filter-btn{
  padding:7px 15px;border-radius:99px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2);transition:.15s;
}
.filter-btn:hover{border-color:var(--gold);color:var(--gold)}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}
[data-theme="dark"] .filter-btn.active{color:#16181d}

.items{display:grid;gap:10px;max-width:1000px}
.items.grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));max-width:none;gap:14px}

.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px 16px 22px;
  transition:border-color .2s,transform .15s,box-shadow .2s;
  position:relative;overflow:hidden;display:flex;gap:14px;align-items:flex-start;
}
.item::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--cat-color,var(--gold));opacity:.65;transition:opacity .2s,width .2s;
}
.item:hover{
  border-color:color-mix(in srgb,var(--cat-color,var(--gold)) 50%,var(--line));
  transform:translateY(-2px);box-shadow:var(--shadow);
}
.item:hover::before{opacity:1;width:4px}
.item.fav{background:linear-gradient(180deg,var(--gold-soft) 0%,var(--panel) 70%)}
.item.fav::before{opacity:1}
.item-num-badge{
  flex-shrink:0;width:34px;height:34px;border-radius:10px;
  background:color-mix(in srgb,var(--cat-color,var(--gold)) 12%,var(--panel));
  color:var(--cat-color,var(--gold));display:grid;place-items:center;
  font-family:var(--serif);font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;
  border:1px solid color-mix(in srgb,var(--cat-color,var(--gold)) 20%,transparent);
}
.item-body{flex:1;min-width:0}
.item-cat-tag{
  font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--cat-color,var(--gold));margin-bottom:6px;display:flex;align-items:center;gap:5px;
}
.item-text{font-family:var(--serif);font-size:16.5px;line-height:1.5;font-weight:500;color:var(--ink)}
.item-foot{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ref-link{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
  color:var(--gold);background:var(--gold-soft);padding:4px 10px;border-radius:7px;
  transition:.15s;border:1px solid transparent;
}
[data-theme="dark"] .ref-link{color:var(--gold-2)}
.ref-link:hover{background:var(--gold);color:#fff;transform:translateY(-1px)}
.ref-link.ready{background:var(--green-soft);color:var(--green)}
.ref-link.ready:hover{background:var(--green);color:#fff}
.item-actions{display:flex;gap:2px;flex-shrink:0;align-items:flex-start}
.act-btn{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-3);transition:.15s;
}
.act-btn:hover{background:var(--line-2);color:var(--ink)}
.act-btn.on{color:var(--gold)}
.act-btn.on svg{fill:currentColor}
.act-btn.copied{color:var(--green)}

.featured{
  background:linear-gradient(135deg,var(--panel) 0%,var(--panel-2) 100%);
  border:1px solid var(--line);border-radius:18px;padding:30px 34px;
  margin-bottom:34px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);
}
.featured::before{
  content:"";position:absolute;top:-60px;right:-60px;width:220px;height:220px;
  background:radial-gradient(circle,var(--gold-soft) 0%,transparent 70%);opacity:.7;pointer-events:none;
}
.featured-eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.featured-eyebrow::after{content:"";height:1px;width:30px;background:var(--gold);opacity:.4}
.featured-text{font-family:var(--serif);font-size:23px;line-height:1.45;font-weight:500;max-width:640px;margin-bottom:16px}
.featured-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.featured-cat{font-size:12px;color:var(--ink-3)}
.featured-actions{margin-left:auto;display:flex;gap:6px}

.empty{text-align:center;padding:80px 20px;color:var(--ink-3)}
.empty .big{font-size:48px;margin-bottom:16px;opacity:.55}
.empty h3{font-size:18px;color:var(--ink-2);margin-bottom:8px;font-weight:600;font-family:var(--serif)}
.empty p{font-size:14px;max-width:360px;margin:0 auto;line-height:1.65}

/* === Modals === */
.modal-bg{
  position:fixed;inset:0;background:rgba(20,16,10,.6);backdrop-filter:blur(6px);
  z-index:100;display:none;place-items:center;padding:20px;
}
.modal-bg.show{display:grid;animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border-radius:20px;max-width:580px;width:100%;
  padding:36px;box-shadow:var(--shadow-lg);border:1px solid var(--line);
  animation:pop .28s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;
}
.modal::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-2),transparent);
}
@keyframes pop{from{transform:scale(.94) translateY(12px);opacity:0}}
.modal .eyebrow{
  font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--gold);margin-bottom:16px;
}
.modal blockquote{font-family:var(--serif);font-size:24px;line-height:1.42;font-weight:500;margin-bottom:18px}
.modal .ref{font-size:13.5px;font-weight:700;color:var(--gold);margin-bottom:6px}
.modal .from{font-size:12.5px;color:var(--ink-3);margin-bottom:28px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:650;
  border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  transition:.15s;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.primary:hover{background:var(--gold-2);border-color:var(--gold-2);color:#16181d}

/* === Verse Reader === */
.verse-bg{
  position:fixed;inset:0;background:rgba(20,16,10,.6);backdrop-filter:blur(6px);
  z-index:110;display:none;place-items:center;padding:20px;
}
.verse-bg.show{display:grid;animation:fade .22s}
.verse-modal{
  background:var(--panel);border-radius:20px;max-width:680px;width:100%;
  max-height:85vh;box-shadow:var(--shadow-lg);border:1px solid var(--line);
  animation:pop .28s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.verse-modal::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-2),transparent);
}
.verse-head{
  padding:22px 26px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
}
.verse-head-left{flex:1;min-width:0}
.verse-ref{
  font-family:var(--serif);font-size:22px;font-weight:600;
  letter-spacing:-.4px;line-height:1.2;margin-bottom:5px;
}
.verse-trans{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.verse-status{color:var(--ink-3);font-weight:600}
.verse-close{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-3);flex-shrink:0;transition:.15s;
}
.verse-close:hover{background:var(--line-2);color:var(--ink)}
.verse-body{
  padding:24px 26px;overflow-y:auto;flex:1;
  font-family:var(--serif);font-size:19px;line-height:1.7;
}
.verse-body::-webkit-scrollbar{width:8px}
.verse-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.verse-part{margin-bottom:14px}
.verse-part-label{
  font-family:-apple-system,sans-serif;
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold);margin-bottom:10px;
}
.verse-num{
  font-family:inherit;font-size:11px;font-weight:700;color:var(--gold);
  vertical-align:super;margin-right:4px;font-feature-settings:"tnum";
}
.verse-loading{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:40px 20px;color:var(--ink-3);font-size:14px;
  font-family:-apple-system,sans-serif;
}
.spinner{
  width:18px;height:18px;border:2px solid var(--line);
  border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.verse-error{
  padding:40px 20px;text-align:center;color:var(--ink-3);
  font-family:-apple-system,sans-serif;font-size:13.5px;line-height:1.6;
}
.verse-error .icon{font-size:32px;margin-bottom:12px;opacity:.6}
.verse-error h4{font-size:15px;color:var(--ink-2);margin-bottom:8px;font-weight:600}
.verse-error p{max-width:360px;margin:0 auto}
.verse-foot{
  padding:14px 26px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.verse-trans-tabs{display:flex;gap:2px;background:var(--line-2);border-radius:9px;padding:3px}
.verse-trans-tab{
  padding:6px 12px;border-radius:7px;font-size:11.5px;font-weight:700;
  color:var(--ink-2);transition:.15s;letter-spacing:.2px;
}
.verse-trans-tab:hover:not(.disabled){color:var(--ink)}
.verse-trans-tab.active{background:var(--panel);color:var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.verse-trans-tab.disabled{opacity:.45;cursor:not-allowed}
.verse-foot-actions{display:flex;gap:6px}
.verse-foot .act-btn{width:34px;height:34px;border:1px solid var(--line)}

.toast{
  position:fixed;bottom:28px;left:50%;transform:translate(-50%,100px);
  background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:12px;
  font-size:13px;font-weight:600;z-index:200;opacity:0;
  transition:.32s cubic-bezier(.22,1,.36,1);pointer-events:none;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.5);white-space:nowrap;
  display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translate(-50%,0);opacity:1}

.backdrop{
  position:fixed;inset:0;background:rgba(20,16,10,.55);z-index:69;
  display:none;backdrop-filter:blur(3px);opacity:0;transition:opacity .25s;
}
.backdrop.show{display:block;opacity:1}

@media(max-width:980px){
  .menu-btn{display:grid}
  .brand-text p{display:none}
  .sidebar{
    position:fixed;left:0;top:0;height:100vh;z-index:70;background:var(--bg);
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
    width:290px;padding-top:22px;box-shadow:0 0 60px rgba(0,0,0,.35);
  }
  .sidebar.open{transform:translateX(0)}
  .content{padding:22px 18px 100px}
  .page-head h2{font-size:26px}
  .featured{padding:24px 22px}
  .featured-text{font-size:19px}

}));

function normalizeBook(raw) {
  if (!raw) return null;
  const key = String(raw).toLowerCase().replace(/[\s.]/g, '').trim();
  return BOOKS[key] || null;
}

/* ==========================================================================
   REFERENCE PARSING
   Handles: "Matt 5:12", "Rom 12:10; Eph 4:32", "Rev 2:7,11,17", "Matt 28:19-20"
   ========================================================================== */
function parseRefs(ref) {
  if (!ref) return [];
  return String(ref)
    .split(';')
    .map(part => {
      part = part.trim().replace(/^cp\.\s*/i, '');
      const m = part.match(/^([1-3]?\s*[A-Za-z]+)\.?\s+(\d+)\s*:\s*(.+)$/);
      if (!m) return null;
      const book = normalizeBook(m[1]);
      if (!book) return null;
      return {
        book,
        chapter: m[2],
        verses: m[3].trim().replace(/\s+/g, ''),
        display: part
      };
    })
    .filter(Boolean);
}

function refKey(p) {
  return `${p.book}.${p.chapter}.${p.verses}`;
}

function apiQuery(p) {
  // "1corinthians" → "1 corinthians"
  const book = p.book.replace(/^([1-3])([a-z])/, '$1 $2');
  return `${book} ${p.chapter}:${p.verses}`;
}

/* ==========================================================================
   VERSE CACHE
   Structure in localStorage: { "kjv::john.3.16": { data: {...}, ts: 12345 } }
   getCached() returns the RAW data (not the wrapper) — this was the bug.
   ========================================================================== */
const CK = 'ntc_verses_v1';
const MK = 'ntc_meta_v1';
let verseCache = {};
let cacheMeta = { lastSync: 0 };
try { verseCache = JSON.parse(localStorage.getItem(CK) || '{}'); } catch (e) {}
try { cacheMeta = JSON.parse(localStorage.getItem(MK) || '{"lastSync":0}'); } catch (e) {}

function persistCache() {
  try {
    localStorage.setItem(CK, JSON.stringify(verseCache));
    localStorage.setItem(MK, JSON.stringify(cacheMeta));
  } catch (e) {
    console.warn('Cache persist failed (likely quota)', e);
  }
}

function getCached(parsed, translation) {
  const entry = verseCache[`${translation}::${refKey(parsed)}`];
  return entry ? entry.data : null;   // <-- returns raw data
}

function putCached(parsed, translation, data) {
  verseCache[`${translation}::${refKey(parsed)}`] = { data, ts: Date.now() };
  cacheMeta.lastSync = Date.now();
}

/* ==========================================================================
   UNIQUE REFERENCE LIST (for bulk download)
   ========================================================================== */
const UNIQUE_REFS = (() => {
  const seen = new Set();
  const list = [];
  ALL.forEach(item => {
    parseRefs(item.ref).forEach(p => {
      const k = refKey(p);
      if (!seen.has(k)) { seen.add(k); list.push(p); }
    });
  });
  return list;
})();
const TOTAL_REFS = UNIQUE_REFS.length;

/* ==========================================================================
   FETCH
   ========================================================================== */
const TRANS_NAMES = { kjv: 'King James Version', web: 'World English Bible', nkjv: 'New King James Version' };

async function fetchVerse(parsed, translation = 'kjv') {
  const cached = getCached(parsed, translation);
  if (cached) return cached;

  if (translation === 'nkjv') {
    throw new Error('NKJV is copyrighted by Thomas Nelson and cannot be bundled offline. Please use KJV or WEB.');
  }

  const url = `https://bible-api.com/${encodeURIComponent(apiQuery(parsed))}?translation=${translation}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Request failed (${res.status})`);
  const json = await res.json();

  let verses = json.verses;
  if (!verses || !verses.length) {
    if (json.text) verses = [{ verse: parsed.verses, text: json.text }];
    else throw new Error('No verses returned');
  }

  const data = {
    reference: json.reference || apiQuery(parsed),
    translation,
    translationName: TRANS_NAMES[translation] || translation.toUpperCase(),
    verses: verses.map(v => ({ v: v.verse, t: (v.text || '').trim() }))
  };
  putCached(parsed, translation, data);
  persistCache();
  return data;
}

function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

function highlight(text, q) {
  if (!q) return esc(text);
  const lower = text.toLowerCase();
  const lq = q.toLowerCase();
  let out = '', i = 0;
  while (true) {
    const idx = lower.indexOf(lq, i);
    if (idx === -1) { out += esc(text.slice(i)); break; }
    out += esc(text.slice(i, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>';
    i = idx + q.length;
  }
  return out;
}

/* ==========================================================================
   OFFLINE CACHE UI
   ========================================================================== */
let isDownloading = false;

function cachedCount() {
  let n = 0;
  for (const r of UNIQUE_REFS) if (getCached(r, 'kjv')) n++;
  return n;
}

function updateOfflineUI() {
  const cached = cachedCount();
  const pct = TOTAL_REFS ? Math.round(cached / TOTAL_REFS * 100) : 0;
  $('#offlineFill').style.width = pct + '%';
  $('#offlineCount').textContent = `${cached} / ${TOTAL_REFS} verses`;
  $('#offlinePct').textContent = pct + '%';

  const btn = $('#offlineBtn');
  const label = $('#offlineBtnLabel');
  const sub = $('#offlineSub');

  if (cached >= TOTAL_REFS && TOTAL_REFS > 0) {
    sub.textContent = 'All verses cached. Fully available offline.';
    btn.classList.remove('primary');
    btn.disabled = false;
    label.textContent = 'Clear Cache';
    btn.onclick = clearCache;
  } else {
    sub.textContent = 'Download Bible verses to read without internet.';
    btn.classList.add('primary');
    btn.disabled = false;
    label.textContent = isDownloading ? 'Downloading…' : 'Download for Offline';
    btn.onclick = startDownload;
  }
}

function clearCache() {
  verseCache = {};
  cacheMeta = { lastSync: 0 };
  persistCache();
  updateOfflineUI();
  renderMain();
  toast('Verse cache cleared');
}

async function startDownload() {
  if (isDownloading) return;
  isDownloading = true;
  updateOfflineUI();

  const queue = UNIQUE_REFS.filter(r => !getCached(r, 'kjv'));
  let done = 0, failed = 0;

  async function worker() {
    while (queue.length) {
      const ref = queue.shift();
      try { await fetchVerse(ref, 'kjv'); done++; }
      catch (e) { failed++; }
      if ((done + failed) % 5 === 0) {
        const cached = cachedCount();
        $('#offlineFill').style.width = Math.round(cached / TOTAL_REFS * 100) + '%';
        $('#offlineCount').textContent = `${cached} / ${TOTAL_REFS} verses`;
      }
      await new Promise(r => setTimeout(r, 100));
    }
  }

  await Promise.all([worker(), worker(), worker()]);
  isDownloading = false;
  updateOfflineUI();
  renderMain();
  toast(failed ? `Done — ${done} saved, ${failed} failed` : `All ${done} verses saved offline`, '✓');
}

          <span class="chip solid">${TOTAL} commands</span>
          <span class="chip">${DATA.length} categories</span>
          <span class="chip green">${cachedCount()} verses offline</span>
        </div>
      </div>
      ${featuredHTML()}`;

    DATA.forEach(cat => {
      const items = state.filter === 'fav' ? cat.items.filter(i => favs.has(i.id)) : cat.items;
      if (!items.length) return;
      html += `<section style="margin-bottom:40px" id="cat-${cat.id}">
        <div class="page-head" style="margin-bottom:16px">
          <h2 style="font-size:22px"><span class="ico" style="font-size:20px">${cat.icon}</span> ${esc(cat.title)}</h2>
          <div class="meta"><span class="chip">${cat.items.length} item${cat.items.length === 1 ? '' : 's'}</span></div>
        </div>
        <div class="items ${view === 'grid' ? 'grid' : ''}">${items.map(i => itemHTML(i, '', false)).join('')}</div>
      </section>`;
    });

    c.innerHTML = html;
    wireItems();
    wireFeatured();
    wireFilters();
    return;
  }

  /* --- Single category --- */
  const cat = DATA.find(x => x.id === state.cat);
  if (!cat) { state.cat = 'all'; return renderMain(); }

  const items = state.filter === 'fav' ? cat.items.filter(i => favs.has(i.id)) : cat.items;

  c.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Category</div>
      <h2><span class="ico">${cat.icon}</span> ${esc(cat.title)}</h2>
      ${cat.sub ? `<div class="sub">${esc(cat.sub)}</div>` : ''}
      <div class="meta">
        <span class="chip">${cat.items.length} item${cat.items.length === 1 ? '' : 's'}</span>
        ${cat.items.filter(i => favs.has(i.id)).length ? `<span class="chip gold">${cat.items.filter(i => favs.has(i.id)).length} ★ favorited</span>` : ''}
      </div>
    </div>
    ${filtersHTML(items.length)}
    ${items.length
      ? `<div class="items ${view === 'grid' ? 'grid' : ''}">${items.map(i => itemHTML(i, '', false)).join('')}</div>`
      : emptyHTML('Nothing to show here', 'Tap the star on any command to save it to your favorites.')}`;
  wireItems();
  wireFilters();
}

/* ==========================================================================
   WIRING
   ========================================================================== */
function wireFilters() {
  $$('.filter-btn').forEach(b => {
    b.onclick = () => { state.filter = b.dataset.f; renderMain(); };
  });
}

function wireItems() {
  $$('.item').forEach(el => {
    const id = el.dataset.id;
    const item = ALL.find(i => i.id === id);
    if (!item) return;

    el.querySelector('[data-act="fav"]').onclick = e => {
      e.stopPropagation();
      if (favs.has(id)) { favs.delete(id); toast('Removed from favorites'); }
      else { favs.add(id); toast('Added to favorites', '★'); }
      saveFavs();
      renderSidebar();
      const isFav = favs.has(id);
      el.classList.toggle('fav', isFav);
      const btn = el.querySelector('[data-act="fav"]');
      btn.classList.toggle('on', isFav);
      btn.querySelector('svg').setAttribute('fill', isFav ? 'currentColor' : 'none');
    };

    el.querySelector('[data-act="copy"]').onclick = async e => {
      e.stopPropagation();
      const btn = e.currentTarget;
      const text = item.text + (item.ref ? ' — ' + item.ref : '');
      try {
        await navigator.clipboard.writeText(text);
        btn.classList.add('copied');
        toast('Copied to clipboard', '✓');
        setTimeout(() => btn.classList.remove('copied'), 1400);
      } catch (err) { toast('Could not copy'); }
    };

    const verseBtn = el.querySelector('[data-act="verse"]');
    if (verseBtn) verseBtn.onclick = e => { e.stopPropagation(); openVerseReader(item.ref, item.id); };
  });
}

function wireFeatured() {
  const feat = $('.featured');
  if (!feat) return;
  const item = ALL.find(i => i.id === feat.dataset.featId);
  if (!item) return;

  feat.querySelector('[data-act="feat-fav"]').onclick = () => {
    if (favs.has(item.id)) { favs.delete(item.id); toast('Removed from favorites'); }
    else { favs.add(item.id); toast('Added to favorites', '★'); }
    saveFavs();
    renderSidebar();
    renderMain();
  };
  feat.querySelector('[data-act="feat-copy"]').onclick = async () => {
    try {
      await navigator.clipboard.writeText(item.text + ' — ' + item.ref);
      toast('Copied to clipboard', '✓');
    } catch (e) { toast('Could not copy'); }
  };
  feat.querySelector('[data-act="feat-shuffle"]').onclick = () => {
    const fresh = ALL[Math.floor(Math.random() * ALL.length)];
    localStorage.setItem(LS.feat, JSON.stringify({ date: new Date().toDateString(), id: fresh.id }));
    renderMain();
  };
  const vb = feat.querySelector('[data-act="verse"]');
  if (vb) vb.onclick = () => openVerseReader(item.ref, item.id);
}

/* ==========================================================================
   VERSE READER
   ========================================================================== */
let verseCtx = null;

async function openVerseReader(ref, commandId) {
  const parsed = parseRefs(ref);

  verseCtx = { ref, parsed, commandId };

  // Header
  $('#vRef').textContent = ref;
  $('#vTransLabel').textContent = TRANS_NAMES[currentTrans] || currentTrans.toUpperCase();
  $$('.verse-trans-tab').forEach(t => t.classList.toggle('active', t.dataset.t === currentTrans));

  // Favorite button
  const favBtn = $('#vFav');
  if (commandId) {
    const isFav = favs.has(commandId);
    favBtn.classList.toggle('on', isFav);
    favBtn.querySelector('svg').setAttribute('fill', isFav ? 'currentColor' : 'none');
  }

  // Open immediately — always give instant feedback
  $('#verseBg').classList.add('show');

  // Handle unparseable
  if (!parsed.length) {
    $('#vStatus').textContent = 'Unavailable';
    $('#vBody').innerHTML = `<div class="verse-error"><div class="icon">📖</div><h4>Could not parse this reference</h4><p>“${esc(ref)}” isn't in a format this reader recognizes.</p></div>`;
    return;
  }

  await loadVerse();
}

async function loadVerse() {
  const body = $('#vBody');
  const status = $('#vStatus');
  const parsed = verseCtx.parsed;

  // Cache hit path
  const cached = getCached(parsed[0], currentTrans);
  if (cached) {
    renderVerses([cached]);
    status.innerHTML = '✓ Cached offline';
    status.style.color = 'var(--green)';
    return;
  }

  // Fetch path
  body.innerHTML = `<div class="verse-loading"><div class="spinner"></div><span>Loading ${esc(TRANS_NAMES[currentTrans] || currentTrans.toUpperCase())}…</span></div>`;
  status.textContent = 'Fetching…';
  status.style.color = '';

  try {
    const results = [];
    for (const p of parsed) {
      results.push(await fetchVerse(p, currentTrans));
    }
    renderVerses(results);
    status.innerHTML = '✓ Just downloaded';
    status.style.color = 'var(--green)';
    updateOfflineUI();
  } catch (e) {
    body.innerHTML = `<div class="verse-error">
      <div class="icon">📡</div>
      <h4>Verse not available</h4>
      <p>${esc(e.message || 'Connect to the internet to fetch this verse, or use “Download for Offline” in the sidebar for permanent offline access.')}</p>
    </div>`;
    status.textContent = '✗ Unavailable';
    status.style.color = 'var(--red)';
  }
}

function renderVerses(results) {
  const body = $('#vBody');
  if (results.length === 1) {
    body.innerHTML = results[0].verses
      .map(v => `<div class="verse-part"><span class="verse-num">${v.v}</span>${esc(v.t)}</div>`)
      .join('');
  } else {
    body.innerHTML = results.map(data =>
      `<div style="margin-bottom:20px">
        <div class="verse-part-label">${esc(data.reference)}</div>
        ${data.verses.map(v => `<div class="verse-part"><span class="verse-num">${v.v}</span>${esc(v.t)}</div>`).join('')}
      </div>`
    ).join('');
  }
}

// Translation tabs
$$('.verse-trans-tab').forEach(tab => {
  tab.onclick = () => {
    if (tab.classList.contains('disabled')) {
      toast('NKJV is copyrighted — try KJV or WEB');
      return;
    }
    const t = tab.dataset.t;
    if (t === currentTrans) return;
    currentTrans = t;
    localStorage.setItem(LS.trans, t);
    $('#vTransLabel').textContent = TRANS_NAMES[t] || t.toUpperCase();
    $$('.verse-trans-tab').forEach(x => x.classList.toggle('active', x.dataset.t === t));
    loadVerse();
  };
});

$('#vClose').onclick = () => $('#verseBg').classList.remove('show');
$('#verseBg').onclick = e => { if (e.target === $('#verseBg')) $('#verseBg').classList.remove('show'); };

$('#vCopy').onclick = async () => {
  if (!verseCtx) return;
  const data = getCached(verseCtx.parsed[0], currentTrans);
  if (!data) return toast('Nothing to copy yet');
  const text = data.verses.map(v => v.t).join(' ') + ' — ' + data.reference + ' (' + (TRANS_NAMES[currentTrans] || currentTrans.toUpperCase()) + ')';
  try {
    await navigator.clipboard.writeText(text);
    toast('Verse copied', '✓');
  } catch (e) { toast('Could not copy'); }
};

$('#vFav').onclick = () => {
  if (!verseCtx || !verseCtx.commandId) return;
  const id = verseCtx.commandId;
  if (favs.has(id)) { favs.delete(id); toast('Removed from favorites'); }
  else { favs.add(id); toast('Added to favorites', '★'); }
  saveFavs();
  renderSidebar();
  const isFav = favs.has(id);
  const btn = $('#vFav');
  btn.classList.toggle('on', isFav);
  btn.querySelector('svg').setAttribute('fill', isFav ? 'currentColor' : 'none');
};

/* ==========================================================================
   SEARCH
   ========================================================================== */
let searchT;
$('#search').addEventListener('input', e => {
  clearTimeout(searchT);
  searchT = setTimeout(() => {
    state.q = e.target.value;
    renderMain();
  }, 120);
});

/* ==========================================================================
   RANDOM MODAL
   ========================================================================== */
let currentRandom = null;
function showRandom() {
  currentRandom = ALL[Math.floor(Math.random() * ALL.length)];
  $('#mEyebrow').innerHTML = currentRandom.catIcon + '  ' + esc(currentRandom.catTitle);
  $('#mText').textContent = currentRandom.text;
  $('#mRef').textContent = currentRandom.ref;
  $('#mFrom').textContent = `Command ${currentRandom.n} of ${currentRandom.total} in this category`;
  $('#modalBg').classList.add('show');
}
$('#randomBtn').onclick = showRandom;
$('#mAnother').onclick = showRandom;
$('#mClose').onclick = () => $('#modalBg').classList.remove('show');
$('#modalBg').onclick = e => { if (e.target === $('#modalBg')) $('#modalBg').classList.remove('show'); };
$('#mGo').onclick = () => {
  if (!currentRandom) return;
  state.cat = currentRandom.catId;
  state.filter = 'all';
  state.q = '';
  $('#search').value = '';
  $('#modalBg').classList.remove('show');
  renderSidebar();
  renderMain();
  setTimeout(() => {
    const el = document.getElementById('i-' + currentRandom.id.replace(/[:]/g, '_'));
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.transition = 'box-shadow .4s';
      el.style.boxShadow = '0 0 0 4px var(--gold-soft), 0 12px 32px -16px rgba(60,48,20,.3)';
      setTimeout(() => { el.style.boxShadow = ''; }, 2000);
    }
  }, 140);
};

/* ==========================================================================
   SIDEBAR MOBILE
   ========================================================================== */
function openSidebar() { $('#sidebar').classList.add('open'); $('#backdrop').classList.add('show'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); }
$('#menuBtn').onclick = () => $('#sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
$('#backdrop').onclick = closeSidebar;

/* ==========================================================================
   READING PROGRESS
   ========================================================================== */
function updateReadProgress() {
  const h = document.documentElement;
  const scrolled = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
  $('#readProgress').style.width = Math.min(100, scrolled * 100) + '%';
}
window.addEventListener('scroll', updateReadProgress, { passive: true });
window.addEventListener('resize', updateReadProgress);

/* ==========================================================================
   KEYBOARD
   ========================================================================== */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#search')) {
    e.preventDefault();
    $('#search').focus();
  }
  if (e.key === 'Escape') {
    if ($('#verseBg').classList.contains('show')) $('#verseBg').classList.remove('show');
    else if ($('#modalBg').classList.contains('show')) $('#modalBg').classList.remove('show');
    else if (document.activeElement === $('#search')) $('#search').blur();
    closeSidebar();
  }
  if (e.altKey && e.key.toLowerCase() === 'r') { e.preventDefault(); showRandom(); }
});

/* ==========================================================================
   BOOT
   ========================================================================== */
renderSidebar();
renderMain();
updateReadProgress();
updateOfflineUI();

// Silent warmup — fetch first 15 unique refs to give instant offline access to popular verses
(async function warmup() {
  const refs = UNIQUE_REFS.slice(0, 15).filter(r => !getCached(r, 'kjv'));
  for (const r of refs) {
    try { await fetchVerse(r, 'kjv'); } catch (e) {}
  }
  updateOfflineUI();
})();
</script>
