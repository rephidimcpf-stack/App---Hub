    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

      font-weight: 700;
      letter-spacing: -0.02em;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
      align-items: center;
    }

      min-width: 200px;
      position: relative;
    }

      padding: 0.65rem 1rem 0.65rem 2.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap::before {
      content: "⌕";
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;

      gap: 0.4rem;
      flex-wrap: wrap;
    }

      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;

    .filter-btn.active {

      color: #0f1419;
      border-color: var(--accent);

      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;

      gap: 1rem;
      margin-bottom: 1.5rem;

      border-radius: var(--radius);
      padding: 0.75rem 1.1rem;
      font-size: 0.9rem;

    .timeline {
      position: relative;
      padding-left: 1.5rem;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, var(--ot), var(--nt));
      border-radius: 2px;
    }
    .era {
      margin-bottom: 2rem;
    }
    .era-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      padding-left: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);

      border-radius: var(--radius);
      margin-bottom: 0.85rem;
      overflow: hidden;
      transition: box-shadow 0.25s, border-color 0.25s;

      box-shadow: var(--shadow);

      align-items: center;
      gap: 0.9rem;
      padding: 1rem 1.15rem;

    .avatar.nt { background: linear-gradient(135deg, #4a9eff, #7ec0ff); }

    .card-name {
      font-weight: 650;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;

      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;

    .card-role {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.15rem;
    }
    .chevron {
      color: var(--text-muted);
      transition: transform 0.25s;
      font-size: 1.2rem;
    }
    .card.open .chevron { transform: rotate(180deg); }
    .card-body {
      display: none;
      padding: 0 1.15rem 1.25rem;
      border-top: 1px solid var(--border);
    }
    .card.open .card-body { display: block; }
    .section {
      margin-top: 1rem;
    }
    .section h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.4rem;

    .section p, .section li {

      font-size: 0.95rem;

    .section ul {

      margin-top: 0.3rem;
    }
    .section li { margin-bottom: 0.35rem; }
    .refs {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
      font-style: italic;
    }
    .apply {
      background: rgba(61,186,122,0.1);
      border-left: 3px solid var(--success);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
      margin-top: 0.75rem;

    .apply h4 { color: var(--success); }
    .empty {

      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.25rem; }
      .card-header { padding: 0.85rem; }
      .avatar { width: 40px; height: 40px; font-size: 0.95rem; }
    }
  </style>
</head>

    // ---------- State ----------
    let activeFilter = "all";
    let searchTerm = "";

    const timelineEl = document.getElementById("timeline");
    const statsEl = document.getElementById("stats");
    const emptyEl = document.getElementById("empty");
    const searchInput = document.getElementById("search");

    // ---------- Helpers ----------
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&" + "amp;")
        .replace(/</g, "&" + "lt;")
        .replace(/>/g, "&" + "gt;")
        .replace(/"/g, "&" + "quot;");
    }

    function matches(c) {
      if (activeFilter !== "all" && c.testament !== activeFilter) return false;
      if (!searchTerm) return true;
      const haystack = [
        c.name, c.role, c.era, c.summary, c.application, c.refs,
        (c.lessons || []).join(" ")
      ].join(" ").toLowerCase();
      return searchTerm.split(/\s+/).every(w => haystack.includes(w));
    }

    function cardHtml(c) {
      const testamentLabel = c.testament === "ot" ? "OT" : "NT";
      const lessons = (c.lessons || [])
        .map(l => `<li>${escapeHtml(l)}</li>`)
        .join("");
      return `
        <div class="card" data-id="${escapeHtml(c.id)}">
          <div class="card-header">
            <div class="avatar ${c.testament}">${escapeHtml(c.initial)}</div>
            <div class="card-meta">
              <div class="card-name">
                ${escapeHtml(c.name)}
                <span class="badge ${c.testament}">${testamentLabel}</span>
              </div>
              <div class="card-role">${escapeHtml(c.role)}</div>
            </div>
            <span class="chevron">⌄</span>
          </div>
          <div class="card-body">
            <div class="section">
              <h4>Story</h4>
              <p>${escapeHtml(c.summary)}</p>
            </div>
            <div class="section">
              <h4>Spiritual & Moral Lessons</h4>
              <ul>${lessons}</ul>
            </div>
            <div class="section apply">
              <h4>Life Application</h4>
              <p>${escapeHtml(c.application)}</p>
            </div>
            <div class="refs">${escapeHtml(c.refs)}</div>
          </div>
        </div>`;
    }

    // ---------- Render ----------
    function render() {
      const visible = characters.filter(matches);

      // group by era, preserving the chronological order of the data
      const eraOrder = [];
      const byEra = {};
      characters.forEach(c => {
        if (!byEra[c.era]) {
          byEra[c.era] = [];
          eraOrder.push(c.era);
        }
      });
      const grouped = {};
      visible.forEach(c => {
        (grouped[c.era] = grouped[c.era] || []).push(c);
      });

      let html = "";
      eraOrder.forEach(era => {
        const items = grouped[era];
        if (!items || !items.length) return;
        const anyNt = items.some(c => c.testament === "nt");
        html += `<section class="era${anyNt ? " era-nt" : ""}">
          <h3 class="era-title">${escapeHtml(era)}</h3>
          ${items.map(cardHtml).join("")}
        </section>`;
      });

      timelineEl.innerHTML = html;
      emptyEl.style.display = visible.length ? "none" : "block";

      const otTotal = characters.filter(c => c.testament === "ot").length;
      const ntTotal = characters.filter(c => c.testament === "nt").length;
      statsEl.innerHTML = `
        <div class="stat"><strong>${visible.length}</strong> showing${searchTerm || activeFilter !== "all" ? " of " + characters.length : ""}</div>
        <div class="stat"><strong>${otTotal}</strong> Old Testament</div>
        <div class="stat"><strong>${ntTotal}</strong> New Testament</div>
        <div class="stat"><strong>${characters.reduce((n, c) => n + (c.lessons || []).length, 0)}</strong> lessons</div>`;
    }

    // ---------- Events ----------
    timelineEl.addEventListener("click", e => {
      const header = e.target.closest(".card-header");
      if (!header) return;
      header.parentElement.classList.toggle("open");
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        render();
      });
    });

    searchInput.addEventListener("input", e => {
      searchTerm = e.target.value.trim().toLowerCase();
      render();
    });

    render();
  </script>
